// ---------------------------------------------------------------- Geometrie

var boardEl=$('board'),under=$('under'),stonesL=$('stones'),fx=$('fx'),hits=$('hits'),guide=$('guide');

  SPOKES.forEach(function(s){var a=E.COORDS[s[0]],b=E.COORDS[s[1]];paths.push('M'+a[0]*1000+' '+a[1]*1000+' L'+b[0]*1000+' '+b[1]*1000);});

// ---------------------------------------------------------------- Animation (Web Animations, mit Rückfall)
function anim(el,frames,opts){
  if(!el.animate||reduce){var last=frames[frames.length-1];for(var k in last)if(k!=='offset'&&k!=='easing')el.style[k]=last[k];return Promise.resolve();}
  var a=el.animate(frames,opts);
  return new Promise(function(res){var done=false;function fin(){if(!done){done=true;res(a);}}a.onfinish=fin;a.oncancel=fin;setTimeout(fin,(opts.duration||0)+(opts.delay||0)+120);});
}
function wait(ms){return new Promise(function(r){setTimeout(r,reduce?Math.min(ms,60):ms);});}
function ease(mode,t){return mode===2?1-Math.pow(1-t,3):(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);}

function at(node,p){var c=P(p);node.style.left=pc(c.x);node.style.top=pc(c.y);return node;}

// Flug/Schub eines Steins von (sx,sy) px Versatz ins Ziel – Bahnformeln wie lib/components/board/stoneFx.tsx.
function travel(stone,sx,sy,o){
  var N=16,fr=[];
  for(var i=0;i<=N;i++){var u=i/N,e=ease(o.mode,u),arc=(u<=0||u>=1)?0:Math.sin(Math.PI*u);
    var sc=(1+arc*o.hopScale)*(1+(o.approach||0)*(1-e));
    fr.push({offset:u,opacity:o.fadeIn?Math.min(1,u/.12):1,transform:'translate('+(sx*(1-e)).toFixed(2)+'px,'+(sy*(1-e)-arc*o.hop).toFixed(2)+'px) scale('+sc.toFixed(4)+')'});}
  if(o.trail&&!reduce)trail(stone,sx,sy,o);
  return anim(stone,fr,{duration:o.dur,easing:'linear'});
}
function trail(stone,sx,sy,o){
  var color=stone.classList.contains('b')?'#111111':'#FAFAFA';
  for(var i=1;i<=o.trail;i++){(function(i){
    var lag=i*(o.trail>3?.055:.07),base=.34*Math.pow(.68,i-1),g=el('fxe',under,{left:stone.style.left,top:stone.style.top,width:'10.4%',height:'10.4%',margin:'-5.2% 0 0 -5.2%',borderRadius:'50%',background:color,border:'1px solid rgba(0,0,0,.14)',opacity:0}),fr=[];
    for(var k=0;k<=12;k++){var p=k/12,q=Math.min(1,Math.max(0,(p-lag)/(1-lag))),e=ease(o.mode,q),arc=(q<=0||q>=1)?0:Math.sin(Math.PI*q),live=(p>0&&p<1)?1:0;
      fr.push({offset:p,opacity:live*base*Math.pow(1-p,.6),transform:'translate('+(sx*(1-e)).toFixed(2)+'px,'+(sy*(1-e)-arc*o.hop).toFixed(2)+'px) scale('+(1-i*.07)+')'});}
    anim(g,fr,{duration:o.dur,easing:'linear'}).then(function(){g.remove();});
  })(i);}
}
function squash(stone,a){var b=stone.querySelector('.body');return anim(b,[{transform:'scale(1,1)'},{offset:.22,transform:'scale('+(1+a)+','+(1-a)+')'},{offset:.56,transform:'scale('+(1-a*.35)+','+(1+a*.35)+')'},{transform:'scale(1,1)'}],{duration:320,easing:'ease-out'});}

  anim(r1,[{opacity:.75,transform:'scale(1)'},{opacity:0,transform:'scale('+(1+reach)+')'}],{duration:dur,easing:'cubic-bezier(.25,.46,.45,.94)'}).then(function(){r1.remove();});
  anim(r2,[{opacity:0,transform:'scale(1)'},{offset:.12,opacity:.4,transform:'scale(1)'},{opacity:0,transform:'scale('+(1+reach*1.45)+')'}],{duration:dur,easing:'cubic-bezier(.25,.46,.45,.94)'}).then(function(){r2.remove();});

// ---------------------------------------------------------------- Zustand
var L=0,lvl,board,mode='busy',sel=null,millsDone=0,supply=0,blackStart=0,moveCount=0,wrong=0,hintTimer=0,band=null,targets=[],token=0;

// ---------------------------------------------------------------- Eingabe
function onTap(p){
  if(paused)return;
  unlock();
  if(mode==='capture')return tapCapture(p);
  if(mode!=='play')return;
  clearHint();scheduleHint(6000);
  if(lvl.phase==='place'){
    if(board[p]){shake(p);play('invalid',.6);return setStatus(t.occupied,'warn');}
    return doPlace(p);
  }
  if(board[p]==='W'){
    if(sel===p){deselect();play('select',.5);return setStatus(t.starts[L]);}
    if(!E.targets(board,p).length){shake(p);play('invalid',.6);return setStatus(t.noMoves,'warn');}
    select(p);play('select');return setStatus(t.selected);
  }
  if(board[p]==='B'){shake(p);play('invalid',.6);return setStatus(t.pickWhite,'warn');}
  if(sel==null){play('invalid',.5);return setStatus(t.pickWhite,'warn');}
  if(E.targets(board,sel).indexOf(p)<0){play('invalid',.6);return setStatus(t.notAdjacent,'warn');}
  var from=sel;deselect();doMove(from,p);
}
function select(p){deselect();sel=p;stoneEls[p].classList.add('sel');E.targets(board,p).forEach(function(q){at(el('dest',under),q);});}

function clearDest(){var d=under.querySelectorAll('.dest');for(var i=0;i<d.length;i++)d[i].remove();}

function doPlace(p){
  mode='busy';var tk=token;
  var src=lastSupplyMini(),c=P(p),br=boardEl.getBoundingClientRect(),sx=0,sy=-R*S*1.4;
  if(src){var r=src.getBoundingClientRect();sx=r.left+r.width/2-(br.left+c.x*S);sy=r.top+r.height/2-(br.top+c.y*S);src.classList.add('away');}
  supply--;board[p]='W';moveCount++;
  var s=makeStone('W',p),dist=Math.hypot(sx,sy),r=R*S;
  travel(s,sx,sy,{mode:2,dur:Math.round(Math.min(440,300+dist*.22)),hop:r*.9,hopScale:.16,approach:.18,fadeIn:true,trail:3}).then(function(){
    if(tk!==token)return;
    play('place');squash(s,.12);landing(p,false,false);labelHits();
    if(E.inMill(board,p))return mill(p);
    wrong++;setStatus(t.noMill,'warn');
    wait(520).then(function(){if(tk!==token)return;play('invalid',.55);
      var src2=lastSupplyMini(),b2=boardEl.getBoundingClientRect(),tx=0,ty=-r*1.4;
      var away=$('tray-w').querySelectorAll('.mini.away'),back=away[0];
      if(back){var rr=back.getBoundingClientRect();tx=rr.left+rr.width/2-(b2.left+c.x*S);ty=rr.top+rr.height/2-(b2.top+c.y*S);}
      var fr=[];for(var i=0;i<=12;i++){var u=i/12,e=ease(0,u),arc=Math.sin(Math.PI*u);fr.push({offset:u,opacity:u>.85?(1-u)/.15:1,transform:'translate('+(tx*e).toFixed(1)+'px,'+(ty*e-arc*r*.9).toFixed(1)+'px) scale('+(1-.3*e)+')'});}
      anim(s,fr,{duration:380,easing:'linear',fill:'forwards'}).then(function(){if(tk!==token)return;s.remove();delete stoneEls[p];board[p]=null;supply++;moveCount--;if(back)back.classList.remove('away');labelHits();mode='play';showHint();});
    });
  });
}

// ---------------------------------------------------------------- Ziehen
function doMove(from,to,isAI){
  mode=isAI?'ai':'busy';var tk=token,color=board[from];
  var a=P(from),b=P(to),sx=(a.x-b.x)*S,sy=(a.y-b.y)*S,r=R*S;
  board[from]=null;board[to]=color;if(!isAI)moveCount++;
  var s=moveStoneEl(from,to);
  return travel(s,sx,sy,{mode:0,dur:280,hop:r*.32,hopScale:.08,trail:3}).then(function(){
    if(tk!==token)return;
    play('move');squash(s,.1);landing(to,color==='B',false);labelHits();
    if(isAI)return;
    if(E.inMill(board,to))return mill(to);
    wrong++;setStatus(t.noMill,'warn');
    return wait(480).then(function(){if(tk!==token)return;play('invalid',.55);
      board[to]=null;board[from]=color;moveCount--;moveStoneEl(to,from);
      return travel(s,(b.x-a.x)*S,(b.y-a.y)*S,{mode:0,dur:260,hop:r*.32,hopScale:.08,trail:0}).then(function(){if(tk!==token)return;labelHits();mode='play';showHint();});
    });
  });
}

// ---------------------------------------------------------------- Mühle
var STAGGER=110,BAND_MS=320;
function mill(p){
  var tk=token,line=E.millsAt(board,p)[0],origin=line.indexOf(p);
  millsDone++;
  var zw=lvl.id==='zwick'&&millsDone>1;
  play(zw?'zwick':'mill');
  makeBand(line,origin);
  var ord=[0,1,2].sort(function(x,y){return Math.abs(x-origin)-Math.abs(y-origin);});
  ord.forEach(function(k,i){var q=line[k],s=stoneEls[q];if(!s)return;var d=40+i*STAGGER;
    anim(s.querySelector('.body'),[{transform:'scale(1)'},{offset:.3,transform:'scale(1.2)'},{offset:.62,transform:'scale(.95)'},{offset:.82,transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:440,delay:d,easing:'ease-out'});
    anim(s.querySelector('.glint'),[{opacity:0},{offset:.2,opacity:.5},{opacity:0}],{duration:420,delay:d});
    millRing(q,d);stars(q,i,d);
  });
  setStatus(t.mill,'good');
  return wait(BAND_MS+STAGGER*2+60).then(function(){if(tk!==token)return;
    showTargets();mode='capture';scheduleHint(5000);
  });
}
function millRing(p,d){if(reduce)return;var g=at(el('fxe ring',fx,{border:'2px solid rgba(212,160,32,.9)',boxShadow:'0 0 8px rgba(212,160,32,.6)'}),p);
  anim(g,[{opacity:0,transform:'scale(.8)'},{offset:.14,opacity:1,transform:'scale(1.05)'},{offset:.63,opacity:1,transform:'scale(1.35)'},{opacity:0,transform:'scale(1.45)'}],{duration:860,delay:d,easing:'ease-out',fill:'backwards'}).then(function(){g.remove();});}
var STAR='<svg viewBox="0 0 16 16" width="100%" height="100%"><path d="M8 .8 9.4 6.6 15.2 8 9.4 9.4 8 15.2 6.6 9.4.8 8 6.6 6.6Z" fill="COL" stroke="#B8860B" stroke-width=".5"/></svg>';
function stars(p,pi,d){if(reduce)return;var cols=['#F6D365','#FFF1B8','#D4A020'],k=S/360;
  for(var i=0;i<5;i++){var ang=(i/5)*Math.PI*2+pi*.7,dist=34*k*(.6+((i*37+pi*11)%10)/25),sz=12*k;
    var st=at(el('fxe',fx,{width:sz+'px',height:sz+'px',margin:(-sz/2)+'px 0 0 '+(-sz/2)+'px'}),p);st.innerHTML=STAR.replace('COL',cols[i%3]);
    (function(st,dx,dy){anim(st,[{opacity:1,transform:'translate(0,0) scale(1.2) rotate(0)'},{offset:.65,opacity:1,transform:'translate('+dx*.93+'px,'+dy*.93+'px) scale(.88) rotate(91deg)'},{opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(.7) rotate(140deg)'}],{duration:980,delay:d,easing:'cubic-bezier(.22,.61,.36,1)',fill:'backwards'}).then(function(){st.remove();});})(st,Math.cos(ang)*dist,Math.sin(ang)*dist);}
}
function makeBand(line,origin){
  removeBand(true);
  var a=P(line[0]),c=P(line[2]),len=Math.hypot(c.x-a.x,c.y-a.y),ang=Math.atan2(c.y-a.y,c.x-a.x),h=2*R+0.033,w=len+h,f=origin/2;
  var box=el('band',under,{left:pc((a.x+c.x)/2-w/2),top:pc((a.y+c.y)/2-h/2),width:pc(w),height:pc(h),transform:'rotate('+ang+'rad)'});
  var fill=el('fill',box),o1=el('orb',box),o2=el('orb',box),x0=f*len/w*100,ww=h/w*100;
  fill.style.left=x0+'%';fill.style.width=ww+'%';
  var D={duration:BAND_MS,delay:40,easing:'cubic-bezier(.215,.61,.355,1)',fill:'both'};
  anim(fill,[{left:x0+'%',width:ww+'%'},{left:'0%',width:'100%'}],D).then(function(){fill.style.left='0%';fill.style.width='100%';if(band&&band.box===box)box.classList.add('breathe');});
  var c1=(f*len+h/2)/w*100,c2=c1;
  [[o1,c1,h/2/w*100,f>0],[o2,c2,(len+h/2)/w*100,f<1]].forEach(function(o){if(!o[3]||reduce){o[0].remove();return;}
    anim(o[0],[{left:o[1]+'%',opacity:1},{offset:.85,opacity:1},{left:o[2]+'%',opacity:0}],D).then(function(){o[0].remove();});});
  anim(box,[{opacity:0},{opacity:1}],{duration:90,delay:40,fill:'backwards'});
  band={box:box,line:line};
}
function removeBand(now){if(!band)return;var b=band.box;band=null;if(now||reduce){b.remove();return;}anim(b,[{opacity:1},{opacity:0}],{duration:260,fill:'forwards'}).then(function(){b.remove();});}

// ---------------------------------------------------------------- Schlagen
function showTargets(){
  clearTargets();
  var list=E.removable(board,'B');
  list.forEach(function(p,i){
    var g=at(el('target',under),p);
    g.innerHTML='<svg viewBox="-50 -50 100 100"><g class="halo"><circle r="39.2" fill="#DC6446" fill-opacity=".14"/><circle r="32.2" fill="#DC6446" fill-opacity=".1"/></g><g class="lock"><circle class="spin" r="31.6" fill="none" stroke="#DC6446" stroke-opacity=".95" stroke-width="3.2" stroke-dasharray="10.3 6.3" stroke-linecap="round"/></g></svg>';
    anim(g.querySelector('.lock'),[{opacity:0,transform:'scale(1.6)'},{opacity:1,transform:'scale(1)'}],{duration:260,delay:i*70,easing:'cubic-bezier(.215,.61,.355,1)',fill:'backwards'});
    anim(g.querySelector('.halo'),[{opacity:0},{opacity:1}],{duration:260,delay:i*70,fill:'backwards'});
    stoneEls[p].classList.add('breathe');targets.push(g);
  });
}
function clearTargets(){targets.forEach(function(g){g.remove();});targets=[];for(var p in stoneEls)stoneEls[p].classList.remove('breathe');}
function tapCapture(p){
  clearHint();
  scheduleHint(4000);
  if(board[p]!=='B'){play('invalid',.5);return setStatus(t.pickTarget,'warn');}
  if(E.removable(board,'B').indexOf(p)<0){shake(p);play('invalid',.6);return setStatus(t.protected,'warn');}
  capture(p);
}
function capture(p){
  mode='busy';var tk=token,s=stoneEls[p],r=R*S;
  clearTargets();delete stoneEls[p];board[p]=null;labelHits();
  play('remove');
  var body=s.querySelector('.body');
  anim(body,[{transform:'translateY(0) scale(1) rotate(0)',opacity:1},{offset:.23,transform:'translateY('+(-r*.45)+'px) scale(1.22) rotate(0)',opacity:1},{offset:.7,transform:'translateY('+(-r*.45)+'px) scale(.1) rotate(80deg)',opacity:0},{transform:'translateY('+(-r*.45)+'px) scale(.1) rotate(80deg)',opacity:0}],{duration:570,easing:'ease-in',fill:'forwards'});
  anim(s.querySelector('.glint'),[{opacity:0},{opacity:.8,offset:.12},{opacity:0}],{duration:330});
  wait(130).then(function(){burst(p,'#111111');});
  markBlackTray();
  return wait(600).then(function(){if(tk!==token)return;s.remove();removeBand(false);
    if(millsDone<lvl.mills)return aiTurn();
    solved();
  });
}
function burst(p,color){
  if(reduce)return;var r=R*S;
  var fl=at(el('fxe ring',fx,{background:'#fff'}),p),wv=at(el('fxe ring',fx,{border:'4px solid #DC6446'}),p);
  anim(fl,[{opacity:.55,transform:'scale(.6)'},{offset:.4,opacity:0,transform:'scale(1.6)'},{opacity:0,transform:'scale(1.6)'}],{duration:440}).then(function(){fl.remove();});
  anim(wv,[{opacity:.9,transform:'scale(.9)',borderWidth:'4px'},{offset:.7,opacity:0,transform:'scale(2.7)',borderWidth:'1.5px'},{opacity:0,transform:'scale(2.7)'}],{duration:440}).then(function(){wv.remove();});
  var parts=[];
  for(var i=0;i<7;i++)parts.push({ang:(i/7)*Math.PI*2+.35,speed:r*(2.3+(i%3)*.3),size:Math.max(3,r*.2),spin:0,round:true,col:'#DC6446'});
  for(var j=0;j<9;j++){var jit=((j*37)%11)/11-.5;parts.push({ang:(j/9)*Math.PI*2+jit*.6-Math.PI/2,speed:r*(1.5+((j*7)%5)*.22),size:r*(.26+((j*3)%4)*.06),spin:(j%2===0?1:-1)*(160+((j*53)%140)),round:false,col:color});}
  parts.forEach(function(q){
    var d=at(el('fxe',fx,{width:q.size+'px',height:(q.round?q.size:q.size*.78)+'px',margin:(-q.size/2)+'px 0 0 '+(-q.size/2)+'px',borderRadius:q.round?'50%':(q.size*.28)+'px',background:q.col,border:q.round?'0':'1px solid rgba(0,0,0,.38)'}),p),fr=[];
    for(var k=0;k<=10;k++){var u=k/10,e=1-(1-u)*(1-u);fr.push({offset:u,opacity:1-Math.pow(u,1.6),transform:'translate('+(Math.cos(q.ang)*q.speed*e).toFixed(1)+'px,'+(Math.sin(q.ang)*q.speed*e*.85+u*u*r*1.4).toFixed(1)+'px) rotate('+(q.spin*u).toFixed(0)+'deg) scale('+(1-u*.45).toFixed(3)+')'});}
    anim(d,fr,{duration:440,easing:'linear'}).then(function(){d.remove();});
  });
}

// ---------------------------------------------------------------- Gegnerzug (nur Zwickmühle)
function aiTurn(){
  mode='ai';var tk=token;setStatus(t.aiTurn);
  return wait(560).then(function(){if(tk!==token)return;
    var m=E.aiMove(board,'B','move');
    if(!m){mode='play';return;}
    return doMove(m.from,m.to,true).then(function(){if(tk!==token)return;setStatus(t.again,'good');mode='play';scheduleHint(3500);});
  });
}

// ---------------------------------------------------------------- Gelöst / Endkarte
function solved(){
  mode='solved';var tk=token,last=L===E.LEVELS.length-1;
  var d=$('dots').children;d[L].className='done';
  play('puzzleSolved',.8);
  if(!last){setStatus(t.solved,'good');return wait(1300).then(function(){if(tk!==token)return;fadeStones().then(function(){if(tk===token)startLevel(L+1);});});}
  setStatus(t.solvedLast,'good');
  post({type:'wm:cleared',game:'muehle-meister',level:E.LEVELS.length,moves:moveCount});
  return wait(1100).then(function(){if(tk!==token)return;showEnd();});
}
function fadeStones(){var list=[];for(var p in stoneEls)list.push(anim(stoneEls[p],[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.7)'}],{duration:220,fill:'forwards'}));return Promise.all(list);}
function showEnd(){
  mode='end';clearHint();play('win',.75);
  var end=$('end');end.hidden=false;
  anim(end,[{opacity:0},{opacity:1}],{duration:260});
  anim(end.querySelector('.card'),[{opacity:0,transform:'translateY(16px) scale(.96)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.2,.8,.3,1.1)'});
  var box=$('stars');box.innerHTML='';
  if(!reduce)for(var i=0;i<14;i++){var a=(i/14)*Math.PI*2,dist=70+(i%3)*22,sz=10+(i%4)*3,st=el('fxe',box,{left:'0',top:'0',width:sz+'px',height:sz+'px',margin:(-sz/2)+'px 0 0 '+(-sz/2)+'px'});st.innerHTML=STAR.replace('COL',['#F6D365','#FFF1B8','#D4A020'][i%3]);
    anim(st,[{opacity:0,transform:'translate(0,0) scale(.4)'},{offset:.2,opacity:1},{offset:.7,opacity:1},{opacity:0,transform:'translate('+(Math.cos(a)*dist).toFixed(0)+'px,'+(Math.sin(a)*dist*.8).toFixed(0)+'px) scale(1) rotate(160deg)'}],{duration:1300,delay:120+i*25,easing:'cubic-bezier(.22,.61,.36,1)',fill:'both'});}
  $('end-cta').focus({preventScroll:true});
}
function hideEnd(){$('end').hidden=true;$('stars').innerHTML='';}

// ---------------------------------------------------------------- Hinweis
var HAND='<svg viewBox="0 0 24 24"><path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z" fill="#0a0a0a" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg>';
function scheduleHint(ms){clearTimeout(hintTimer);hintTimer=setTimeout(showHint,ms);}
function clearHint(){clearTimeout(hintTimer);guide.innerHTML='';}
function hand(){var h=el('hand',guide);h.innerHTML=HAND;return h;}
function placeHand(h,p){var c=P(p);h.style.left=pc(c.x-.16*11.5/24);h.style.top=pc(c.y-.16*6.5/24);}
function showHint(){
  clearHint();
  if(mode==='capture'){var q=E.removable(board,'B')[0];if(q==null)return;var hc=hand();placeHand(hc,q);tapLoop(hc);return;}
  if(mode!=='play')return;
  var sol=E.solutions(board,'W',lvl.phase)[0];if(!sol)return;
  if(sol.from==null||sel===sol.from){at(el('hintring',guide),sol.to);var h=hand();placeHand(h,sol.to);tapLoop(h);return;}
  at(el('hintring',guide),sol.from);at(el('hintring',guide),sol.to);
  var h2=hand();placeHand(h2,sol.from);
  var a=P(sol.from),b=P(sol.to),dx=(b.x-a.x)*S,dy=(b.y-a.y)*S;
  if(reduce)return;
  h2.animate([{transform:'translate(0,0) scale(1)',opacity:0},{offset:.1,opacity:1,transform:'translate(0,0) scale(1)'},{offset:.2,transform:'translate(0,0) scale(.86)'},{offset:.3,transform:'translate(0,0) scale(1)'},{offset:.6,transform:'translate('+dx+'px,'+dy+'px) scale(1)'},{offset:.7,transform:'translate('+dx+'px,'+dy+'px) scale(.86)'},{offset:.8,opacity:1,transform:'translate('+dx+'px,'+dy+'px) scale(1)'},{opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(1)'}],{duration:2200,iterations:Infinity,easing:'ease-in-out'});
}
function tapLoop(h){if(reduce||!h.animate)return;h.animate([{transform:'scale(1)',opacity:.95},{offset:.35,transform:'scale(.84)'},{offset:.6,transform:'scale(1)'},{transform:'scale(1)',opacity:.95}],{duration:1100,iterations:Infinity,easing:'ease-in-out'});}

// ---------------------------------------------------------------- Layout
var mainEl=$('main'),stage=$('stage'),tray=$('tray'),lastS=0;
function layout(){
  var W=window.innerWidth,H=window.innerHeight,land=W>H*1.08&&W>=440;
  document.body.classList.toggle('land',land);
  document.body.classList.toggle('compact',land?H<520:H<640);
  document.body.classList.toggle('tiny',land?H<330:H<500);
  var side=0;
  if(land){var cs=getComputedStyle(mainEl),px=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),py=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    side=Math.max(200,Math.min(340,W*.36));var sz=Math.floor(Math.min(H-py-tray.offsetHeight-6,W-px-22-side));
    mainEl.style.gridTemplateColumns=Math.max(120,sz)+'px minmax(0,1fr)';side=W-px-22-Math.max(120,sz);}
  else mainEl.style.gridTemplateColumns='';
  document.body.classList.toggle('narrow',land&&side<270);
  var r=stage.getBoundingClientRect();
  S=Math.floor(Math.max(120,Math.min(r.width,r.height-tray.offsetHeight-6)));
  boardEl.style.width=boardEl.style.height=S+'px';tray.style.width=S+'px';
  document.body.classList.toggle('smallboard',S<300);document.body.classList.toggle('tinyboard',S<265);
  if(S!==lastS){lastS=S;buildSurface();if(guide.children.length)showHint();}
  fitTitle();
}
function fitTitle(){var h=$('title');h.style.fontSize='';if(document.body.classList.contains('narrow'))return;var fs=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>h.clientWidth+1&&fs>13){fs-=.5;h.style.fontSize=fs+'px';}}
window.addEventListener('resize',layout);
if(window.ResizeObserver){var ro=new ResizeObserver(function(){layout();});ro.observe(document.documentElement);ro.observe(stage);}

// ---------------------------------------------------------------- Knöpfe
function openStore(){
  stopAll();
  if(post({type:'wm:cta',url:STORE}))return;
  var w=window;
  if(w.mraid&&w.mraid.open){w.mraid.open(STORE);return;}
  if(w.FbPlayableAd&&w.FbPlayableAd.onCTAClick){w.FbPlayableAd.onCTAClick();return;}

$('cta').onclick=openStore;$('end-cta').onclick=openStore;
$('hint').onclick=function(){play('buttonTap',.7);showHint();};
$('restart').onclick=function(){play('buttonTap',.7);hideEnd();startLevel(mode==='end'?0:L);};

// ---------------------------------------------------------------- Texte & Start
$('eyebrow').textContent=t.eyebrow;$('title').textContent=t.title;$('cta-label').textContent=t.cta;$('ad-label').textContent=t.adLabel;
$('hint').setAttribute('aria-label',t.hint);$('hint').title=t.hint;$('hint').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M8.5 14.5C7 13.3 6 11.6 6 9.6a6 6 0 0 1 12 0c0 2-1 3.7-2.5 4.9-.6.5-1 1.2-1 2v.5h-5v-.5c0-.8-.4-1.5-1-2Z"/></svg>';
$('restart').setAttribute('aria-label',t.restart);$('restart').title=t.restart;$('restart').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>';
$('end-icon').src=ICON;$('end-eyebrow').textContent=t.puzzle+' 3 / 3 ✓';$('end-title').textContent=t.endTitle;$('end-text').textContent=t.endText;$('end-cta-label').textContent=t.endCta;$('replay').textContent=t.replay;
$('feats').innerHTML=t.feats.map(function(f){return '<span>'+f+'</span>';}).join('');
boardEl.setAttribute('aria-label',t.title);
soundIcon();
layout();
startLevel(0,true);
var readySent=false;function ready(){if(readySent)return;readySent=true;layout();post({type:'wm:ready',game:'muehle-meister'});}
requestAnimationFrame(function(){requestAnimationFrame(ready);});setTimeout(ready,400);
window.__muehlePlayable={state:function(){return {level:L,mode:mode,board:board.slice(),sel:sel,millsDone:millsDone,size:S};},tap:onTap};
})();
