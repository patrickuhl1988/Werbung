<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EC9CA0"><title>Mühle Meister · Play now</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overscroll-behavior:none}
/* Himmel der App (Rätselpakete-Bildschirm): Rosa oben, Pfirsich, Lila unten */
body{background:#F0AF9C linear-gradient(180deg,#EC9CA0 0%,#F0AF9C 45%,#E7A6AE 70%,#A58BBF 100%) fixed;color:#18121B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
button:focus-visible{outline:3px solid #C97721;outline-offset:3px}
button:disabled{opacity:.38;cursor:default}
button:active:not(:disabled){transform:scale(.96)}

main{position:relative;height:100%;height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column;padding:14px 18px 12px;gap:10px;overflow:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;flex:none;box-shadow:0 3px 10px #5a2a3a33;background:center/cover}
.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#5E3B4A}
h1{margin:0;font:700 clamp(16px,5.6vw,26px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sound{height:38px;width:42px;flex:none;background:#FFFFFF8C;border-radius:15px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.layout{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.intro{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#FFFFFFB3;border-radius:18px;padding:9px 12px;box-shadow:0 4px 16px #5a2a3a14}
.intro p{font-size:13px;margin:0;font-weight:700}
.badge{flex:none;padding:6px 10px;border-radius:14px;background:#C97721;color:#fff;font-size:12px;font-weight:700}
.board-area{min-height:0;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:min(100%,430px,calc(100dvh - 340px));min-width:180px;aspect-ratio:1;transform-origin:center}
.stage svg{display:block;width:100%;height:100%;border-radius:4.5%;box-shadow:0 10px 30px #4a243a40;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.won .stage svg{box-shadow:0 0 0 3px #FFC43C,0 0 40px -6px #FFC43CB3;transition:box-shadow .6s}

/* Steine wie im Wiki (Stone.tsx): Anheben, Schweben, Schlagbar, Zielringe, Tipp */
.hit{cursor:pointer}
.piece{will-change:transform}
.stage .tb{transform-box:fill-box;transform-origin:center}
.lift{transition:transform 350ms cubic-bezier(.2,.9,.3,1)}
.lift.sel{transform:translateY(-11px) scale(1.08)}
.lift.hover{animation:hover 1.8s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pin.cap,.halo{animation:cap 1.5s ease-in-out infinite}
@keyframes cap{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.target{animation:target 2s ease-in-out infinite}
@keyframes target{0%,100%{opacity:.85}50%{opacity:.5}}
.coach{animation:coach 1.6s ease-in-out infinite}
@keyframes coach{0%,100%{opacity:.45}50%{opacity:.95}}
.banner{position:absolute;left:50%;top:36%;transform:translate(-50%,0);max-width:92%;z-index:3;padding:10px 22px;border-radius:18px;text-align:center;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px #00000059}
.banner b{display:block;font:900 24px/1.1 Georgia,serif;letter-spacing:1px}
.banner.big{padding:14px 28px;border-radius:22px}
.banner.big b{font-size:clamp(20px,6.2vw,34px);letter-spacing:1px}
.banner span{display:block;margin-top:3px;font-size:13px;font-weight:700;opacity:.92}
.flash{position:absolute;inset:0;border-radius:4.5%;pointer-events:none;z-index:2;opacity:0}

.side{display:flex;flex-direction:column;gap:8px}
.status{margin:0;min-height:36px;text-align:center;font-size:13px;font-weight:600;display:grid;place-items:center;color:#2B1B26}
.actions{display:flex;gap:8px}
.actions button{flex:1;display:flex;gap:7px;align-items:center;justify-content:center;background:#FFFFFFB3;border-radius:16px;min-height:44px;font-size:13px;font-weight:700;box-shadow:0 3px 10px #5a2a3a14}
.actions #hint{background:#FFEEDC}
.next{min-height:42px;background:#C97721;color:#fff;border-radius:16px;font-weight:700;box-shadow:0 4px 12px #c9772140}
.next[hidden]{display:none}
.footer{flex:none}
.cta{width:100%;min-height:48px;background:#C97721;color:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:16px;font-weight:800;box-shadow:0 5px 16px #8a4a1240}
.cta b{font-size:22px}
.done .cta{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035);box-shadow:0 6px 24px #c9772180}}
.footer small{display:block;text-align:center;font-size:9px;color:#3D2533;margin-top:5px;letter-spacing:.5px;opacity:.8}
.celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.celebration i{position:absolute;left:var(--x);top:-10px;width:7px;height:13px;background:var(--c);animation:fall 1.6s var(--d) ease-in forwards}
@keyframes fall{to{transform:translateY(100dvh) rotate(500deg);opacity:0}}

@media(max-height:620px) and (orientation:portrait){
main{padding:8px 12px;gap:5px}.layout{gap:5px}h1{font-size:clamp(15px,5.2vw,22px)}.logo{width:32px;height:32px}.eyebrow{font-size:8px}
.stage{width:min(100%,calc(100dvh - 285px))}.intro{padding:6px 10px}.intro p{font-size:11px}
.status{font-size:11px;min-height:28px}.actions button{min-height:38px}.cta{min-height:40px}.next{min-height:34px}}
@media(orientation:landscape) and (min-width:560px){
main{padding:10px 20px;gap:5px}
.layout{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto 1fr;column-gap:25px;row-gap:6px}
.intro{grid-column:1/-1}
.board-area{grid-column:1;grid-row:2;justify-content:center}
.stage{width:min(100%,calc(100dvh - 125px));min-width:130px}
.side{grid-column:2;grid-row:2;justify-content:center;padding-bottom:62px}
.footer{position:absolute;right:20px;bottom:10px;width:calc(45% - 20px);max-width:380px}
.actions button{min-height:40px}.status{min-height:30px}.cta{min-height:40px}
.logo{width:30px;height:30px}h1{font-size:22px}.eyebrow{font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
</style></head><body><main>

    if (n === 0) { cleared = {}; document.body.classList.remove("done"); }
    load(n);
  };
  $("cta").onclick = function () {
    stopAll();
    if (send({ type: "wm:cta", url: STORE })) return;
    var w = window;
    if (w.mraid && w.mraid.open) { w.mraid.open(STORE); return; }
    if (w.FbPlayableAd && w.FbPlayableAd.onCTAClick) { w.FbPlayableAd.onCTAClick(); return; }
    if (w.dapi && w.dapi.openStoreUrl) { w.dapi.openStoreUrl(); return; }
    window.open(STORE, "_blank", "noopener");
  };

  $("title").textContent = u.title;
  $("eyebrow").textContent = u.eyebrow;
  $("cta-label").textContent = u.cta;
  $("ad-label").textContent = u.ad;
  $("logo").style.backgroundImage = "url(data:image/webp;base64," + DATA.icon + ")";
  $("logo").setAttribute("aria-label", u.title);
  $("hint").innerHTML = icon('<path d="M9 18h6M10 22h4M9 15c0-3-4-3-4-7a7 7 0 0 1 14 0c0 4-4 4-4 7"/>') + "<span>" + u.hint + "</span>";
  $("reset").innerHTML = icon('<path d="M4 10a8 8 0 1 1 0 5M4 3v7h7"/>') + "<span>" + u.reset + "</span>";
  drawSound();
  load(0);
  /* Bereit, sobald das Brett gezeichnet ist; spätestens nach 300 ms, falls Bildaufbau-Rückrufe gedrosselt sind. */
  var readySent = false;
  function ready() { if (readySent) return; readySent = true; send({ type: "wm:ready", game: "muehle-meister" }); }
  requestAnimationFrame(function () { requestAnimationFrame(ready); });
  setTimeout(ready, 300);
})();
</script></body></html>
