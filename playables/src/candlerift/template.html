<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060b12">
<title>CANDLERIFT</title>
<style>
/* Farben aus src/config/Palette.ts (Verdant Abyss) */
:root{--abyss:#060b12;--panel:#0c1622;--ui:#7be8d8;--loot:#ffc64a;--danger:#ff4fa0;--heal:#b9ff7e;--light:#ffe9b8;--txt:#eef3ef;--mut:#a9bdb6;--line:#7be8d84d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;overflow:hidden}
body{background:var(--abyss);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--ui);outline-offset:2px}
button:active{transform:scale(.96)}
main{position:relative;height:100%;height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px}
header{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:40px;height:40px;border-radius:11px;flex:none;background:center/cover;box-shadow:0 0 0 1px #ffe9b833,0 4px 14px #ffc64a33}
.head{flex:1;min-width:0}
.over{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{margin:0;font-size:19px;font-weight:900;letter-spacing:2.5px;line-height:1.15;background:linear-gradient(180deg,#fff6dc,#ffc64a);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:42px;height:42px;flex:none;border-radius:13px;background:#0c1622;border:1px solid #7be8d855;display:grid;place-items:center;color:var(--ui)}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#0b140d;box-shadow:0 0 0 1px #7be8d81f,0 14px 40px #000a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.foot{flex:none}
.cta{width:100%;min-height:50px;border-radius:16px;background:linear-gradient(180deg,#ffd877,#ffb43c);color:#1a1106;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:900;letter-spacing:.2px;box-shadow:0 6px 22px #ffc64a40}
.cta b{font-size:19px}
.done .cta{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035);box-shadow:0 6px 30px #ffc64a99}}
small.ad{display:block;text-align:center;font-size:9px;color:var(--mut);letter-spacing:.5px;opacity:.75;margin-top:4px}
/* Hinweise mit Gestensymbol */
.tip{position:absolute;left:50%;bottom:13%;transform:translate(-50%,8px);max-width:90%;display:flex;align-items:center;gap:12px;padding:10px 15px;border-radius:15px;background:#060b12d9;border:1px solid #7be8d870;box-shadow:0 8px 26px #000b;font-size:15px;font-weight:800;line-height:1.25;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:3}
.tip.on{opacity:1;transform:translate(-50%,0)}
.tip.gold{border-color:#ffc64a99}
.tip.top{bottom:auto;top:58px}
.g{position:relative;width:46px;height:46px;flex:none;display:none}
.g.on{display:block}
.g::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed #7be8d855}
.g i{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 14px 3px #7be8d8}
.g.drag i{animation:gdrag 1.5s ease-in-out infinite alternate}
.g.right i{animation:gright 1s ease-out infinite}
.g.left i{animation:gleft 1s ease-out infinite}
.g.down i{animation:gdown 1s ease-out infinite}
.g.tap i{animation:gtap 1.1s ease-out infinite}
@keyframes gdrag{from{transform:translateX(-15px)}to{transform:translateX(15px)}}
@keyframes gright{0%{transform:translateX(-17px);opacity:0}15%{opacity:1}55%{transform:translateX(17px);opacity:1}75%,100%{transform:translateX(17px);opacity:0}}
@keyframes gleft{0%{transform:translateX(17px);opacity:0}15%{opacity:1}55%{transform:translateX(-17px);opacity:1}75%,100%{transform:translateX(-17px);opacity:0}}
@keyframes gdown{0%{transform:translateY(-17px);opacity:0}15%{opacity:1}55%{transform:translateY(17px);opacity:1}75%,100%{transform:translateY(17px);opacity:0}}
@keyframes gtap{0%{transform:scale(1.5);opacity:0}30%{transform:scale(.8);opacity:1}60%{transform:scale(1)}100%{opacity:0}}
/* Startbild, Wächter-Banner, Ergebnis */
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;background:#060b12 center 28%/cover no-repeat}
.ov[hidden]{display:none}
.ov::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#060b1200 30%,#060b12cc 66%,#060b12 92%)}
.ov>*{position:relative}
#intro{cursor:pointer;padding:18px 18px 22px;text-align:center}
.kick{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ui)}
.ov h2{margin:4px 0 8px;font-size:26px;font-weight:900;line-height:1.1;text-shadow:0 2px 14px #000}
.ov p{margin:0 auto 14px;max-width:340px;font-size:14px;line-height:1.45;color:#dfe9e3;text-shadow:0 1px 8px #000}
.go{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;background:#7be8d81f;border:1.5px solid var(--ui);color:#fff;font-weight:900;font-size:16px;box-shadow:0 0 26px #7be8d855;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 40px #7be8d8aa;transform:scale(1.04)}}
#boss{padding:18px;text-align:center;background-position:center 40%;animation:fadein .35s ease-out}
#boss .kick{color:var(--danger)}
#boss q{display:block;font-style:italic;color:#dfe9e3;font-size:14px;margin-bottom:6px;text-shadow:0 1px 8px #000}
@keyframes fadein{from{opacity:0}}
#card{justify-content:center;align-items:center;padding:14px;background:#060b12d0}
#card::before{display:none}
.cd{width:min(100%,360px);border-radius:20px;overflow:hidden;background:#0c1622;border:1px solid #7be8d855;box-shadow:0 20px 50px #000d;text-align:center;animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.82);opacity:0}}
.hero{height:96px;background:center 45%/cover no-repeat;position:relative}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0c162200 40%,#0c1622)}
.cd .in{padding:2px 16px 16px}
.cd .kick{margin-top:-6px}
.cd h3{margin:4px 0 10px;font-size:23px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats div{background:#060b12;border:1px solid #7be8d826;border-radius:12px;padding:7px 2px}
.stats b{display:block;font-size:19px;font-weight:900;color:var(--loot)}
.stats span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.cd p{margin:0 0 12px;font-size:13px;line-height:1.45;color:#c8d6d0}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:-4px 0 12px}
.chips span{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#7be8d81a;color:var(--ui)}
.cd .pri{width:100%;min-height:48px;border-radius:14px;background:linear-gradient(180deg,#ffd877,#ffb43c);color:#1a1106;font-weight:900;font-size:16px;margin-bottom:8px}
.cd .sec{width:100%;min-height:42px;border-radius:14px;background:#060b12;border:1px solid #7be8d855;color:var(--ui);font-weight:800}
@media (orientation:landscape) and (max-height:520px){
  main{padding-top:6px;gap:6px}.logo{width:32px;height:32px}h1{font-size:16px}.ib{width:36px;height:36px}
  .cta{min-height:40px;font-size:14px}.tip{font-size:13px;bottom:5%;padding:7px 12px}.tip.top{top:8px}.g{width:34px;height:34px}.ov h2{font-size:21px}.ov p{display:none}.hero{display:none}.cd h3{font-size:19px;margin:8px 0}
}
</style></head>
<body><main>
<header><div id="logo" class="logo" role="img"></div><div class="head"><div id="over" class="over"></div><h1>CANDLERIFT</h1></div><button id="sound" class="ib"></button></header>
<div id="stage" class="stage"><canvas id="cv"></canvas>
<div id="tip" class="tip" role="status" aria-live="polite"><div id="gest" class="g"><i></i></div><span id="tipt"></span></div>
<div id="intro" class="ov"><div class="kick" id="i-kick"></div><h2 id="i-title"></h2><p id="i-text"></p><div><span class="go" id="i-go"></span></div></div>
<div id="boss" class="ov" hidden><div class="kick" id="b-kick"></div><h2 id="b-name"></h2><q id="b-quote"></q></div>
<div id="card" class="ov" hidden><div class="cd"><div id="c-hero" class="hero"></div><div class="in"><div id="c-kick" class="kick"></div><h3 id="c-title"></h3><div id="c-stats" class="stats"></div><p id="c-text"></p><div id="c-chips" class="chips"></div><button id="c-main" class="pri"></button><button id="c-again" class="sec"></button></div></div></div>
</div>
<div class="foot"><button id="cta" class="cta"><span id="cta-label"></span><b>↗</b></button><small id="ad" class="ad"></small></div>
</main>
<script>
"use strict";
(function () {

    hurt: function () { tone(240, 70, 0.3, "sawtooth", 0.14); hiss(0.25, 0.3, 500, 120, "lowpass", 1); },

  var cv = $("cv"), g = cv.getContext("2d");

  /* ---------- Welt ---------- */

  var st = null, sentCleared = false, bannerSeen = false;

  function fresh(where) {
    st = { mode: "play", t: 0, ts: 1, tsT: 1, hs: 0, shake: 0, flash: 0, flashC: "255,255,255", camY: 0,

  function build() {
    var Rn = rng(20261111);
    // Tutorial: Lenken, Dash, Sturzschlag
    lumenLine(180, 190, 112, 470, 7);
    st.e1 = enemy("floater", 282, 700, { amp: 8, w: 1.1 });
    lumenLine(150, 820, 210, 900, 3);

    fresh(where); st.lumen = keepLumen; wake();
    if (where === "free") tip(L("Wische nach unten über Ästen – lenke um die Dornen", "Swipe down over branches – steer around thorns"), "down", 2400);
  };
  $("intro").onclick = function () { start(); };

  window.addEventListener("message", function (ev) {
    if (ev.source !== parent) return;
    var m = ev.data;
    try { if (typeof m === "string") m = JSON.parse(m); } catch (e) { return; }
    if (!m) return;
    if (m.type === "wm:mute") { soundOn = !m.muted; if (soundOn) wake(); else stopAll(); drawSound(); }
    if (m.type === "wm:pause") { paused = true; stopAll(); }
    if (m.type === "wm:resume") { paused = false; wake(); }
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) stopAll(); else wake(); });
  window.addEventListener("pagehide", stopAll);
  function openStore() {
    stopAll();
    if (send({ type: "wm:cta", url: STORE })) return;
    var w = window;
    if (w.mraid && w.mraid.open) { w.mraid.open(STORE); return; }
    if (w.FbPlayableAd && w.FbPlayableAd.onCTAClick) { w.FbPlayableAd.onCTAClick(); return; }
    if (w.dapi && w.dapi.openStoreUrl) { w.dapi.openStoreUrl(); return; }
    window.open(STORE, "_blank", "noopener");
  }
  function drawSound() {
    $("sound").innerHTML = soundOn
      ? '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
    $("sound").setAttribute("aria-label", soundOn ? L("Ton aus", "Sound off") : L("Ton an", "Sound on"));
  }
  $("sound").onclick = function () { soundOn = !soundOn; if (soundOn) { wake(); SFX.heal(); } else stopAll(); drawSound(); };
  $("cta").onclick = openStore;
  $("cta-label").textContent = L("CANDLERIFT kostenlos spielen", "Play CANDLERIFT free");
  $("ad").textContent = L("Spielbare Anzeige · JOCULUS", "Playable ad · JOCULUS");
  $("logo").style.backgroundImage = "url(" + webp(IMG.icon) + ")";
  $("logo").setAttribute("aria-label", "CANDLERIFT");
  $("over").textContent = L("Spielbare Demo", "Playable demo");
  $("intro").style.backgroundImage = "url(" + webp(IMG.intro) + ")";
  $("i-kick").textContent = L("Das letzte Licht ist geliehen", "The last light is borrowed");
  $("i-title").textContent = L("Fall in den Weltenbaum", "Fall into the World Tree");
  $("i-text").textContent = L("Der Weltenbaum stirbt. Du bist Lumi, sein letztes Licht. Es gibt nur noch einen Weg: hinab.", "The World Tree is dying. You are Lumi, its last light. There is only one way left: down.");
  $("i-go").textContent = L("▼  Tippen und fallen", "▼  Tap to fall");
  $("boss").style.backgroundImage = "url(" + webp(IMG.boss) + ")";
  $("b-kick").textContent = L("Wächterin", "Warden");
  $("b-name").textContent = L("Dornmutter der Krone", "Thornmother of the Crown");
  $("b-quote").textContent = L("„Wir haben dich fallen sehen. Nach oben.“", "“We watched you fall. Upward.”");
  $("boss").onclick = function () { /* Banner schließt sich selbst */ };
  document.title = "CANDLERIFT · " + L("Jetzt spielen", "Play now");
  drawSound();

  resize();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(cv); else window.addEventListener("resize", resize);
  var step = Q.get("step");  // step=boss|free nur zum Prüfen
  fresh(step === "boss" || step === "free" ? step : null);
  if (step === "boss" || step === "free") { $("intro").hidden = true; bannerSeen = step === "boss" && Q.get("banner") === "0"; $("over").textContent = L("Schicht 1 · Blätterkrone", "Layer 1 · Leaf Crown"); }
  else st.mode = "intro";

  var lastT = 0, readySent = false;
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = lastT ? Math.min(0.034, (ts - lastT) / 1000) : 0; lastT = ts;
    if (!paused && !document.hidden) update(dt);
    render();
  }
  function ready() { if (readySent) return; readySent = true; send({ type: "wm:ready", game: "candlerift" }); }
  var pend = [KEY, ICON].filter(function (im) { return !im.complete; }).map(function (im) { return im.decode ? im.decode().catch(function () {}) : Promise.resolve(); });
  Promise.all(pend).then(function () { requestAnimationFrame(frame); requestAnimationFrame(function () { requestAnimationFrame(ready); }); setTimeout(ready, 300); });
  window.__cr = { get st() { return st; }, dash: dash, slam: slam, chute: chute, start: start };  // nur für die Prüfskripte
})();
</script>
