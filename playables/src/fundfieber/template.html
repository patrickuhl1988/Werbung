  $("go").textContent = L.go; $("fine").textContent = L.fine; $("again").textContent = L.again;
  $("go").addEventListener("click", openStore);
  $("again").addEventListener("click", function () { touch(); play("tap", -14); reset(); toast(L.scanOn); });
  document.title = "FUNDFIEBER · " + L.play;

  var last = 0, readySent = false;
  function ready() { if (readySent) return; readySent = true; send({ type: "wm:ready", game: "fundfieber" }); }
  function frame(t) {
    requestAnimationFrame(frame);
    if (paused) { last = 0; return; }
    var dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016; last = t;
    update(dt); draw();
  }
  function start() {
    if (started) return; started = true;
    // Schattenrisse der Bildfolgen für Nicos Schatten
    Object.keys(ATLAS).forEach(function (k) {
      var a = ATLAS[k], c = document.createElement("canvas"); c.width = a.naturalWidth || 1; c.height = a.naturalHeight || 1;
      var x = c.getContext("2d"); x.drawImage(a, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = "#1c1408"; x.fillRect(0, 0, c.width, c.height);
      SIL[k] = c;
    });
    initGL(); fit(); reset();
    if (Q.get("auto") === "1") { auto = true; idle = 99; }                 // nur zum Prüfen
    for (var w = 0, n = Math.min(3600, (+Q.get("warp") || 0) * 30); w < n; w++) { auto = true; update(1 / 30); }   // warp=Sekunden: vorspulen, nur zum Prüfen
    if (Q.get("end") === "1") { found = FINDS.length; money = 850; hud(); mode = "over"; finish(); }
    toast(L.scanOn);
    window.addEventListener("resize", fit);
    requestAnimationFrame(frame);
    requestAnimationFrame(function () { requestAnimationFrame(ready); });
    setTimeout(ready, 300);
  }
  if (!pending) start();
  window.__ff = { state: function () { return { mode: mode, found: found, money: money, auto: auto, x: hero.x, z: hero.z, gl: !!gl, parts: parts.length, sounds: Object.keys(bufs).length, audio: ctx ? ctx.state : "none" }; } };
})();
</script>
