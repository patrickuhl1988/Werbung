<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA · FUNDFIEBER Playable</title>
<style>
body{margin:0;font:13px system-ui,sans-serif;background:#222;color:#eee;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select{font:inherit;padding:5px 9px;border-radius:7px;border:1px solid #555;background:#333;color:#eee;cursor:pointer}
#frameWrap{background:#000;box-shadow:0 0 0 1px #555;position:relative}
iframe{border:0;display:block;background:transparent}
#log{width:min(900px,96vw);height:120px;overflow:auto;background:#111;border:1px solid #444;border-radius:7px;padding:6px;font:12px ui-monospace,monospace;white-space:pre-wrap}
</style></head><body>
<div class="bar">
  <button data-s="360x540">Overlay hoch 360×540</button>
  <button data-s="390x844">Vollbild hoch 390×844</button>
  <button data-s="320x420">Klein hoch 320×420</button>
  <button data-s="510x360">Overlay quer 510×360</button>
  <button data-s="844x390">Vollbild quer 844×390</button>
  <button data-s="1024x600">Tablet quer 1024×600</button>
  <select id="lang"><option>de</option><option>en</option><option>es</option><option>fr</option><option>it</option><option>nl</option><option>pt</option></select>
  <label><input type="checkbox" id="muted"> muted=1</label>
  <button id="reload">Neu laden</button>
  <button id="mute">wm:mute</button><button id="unmute">wm:unmute</button><button id="pause">wm:pause</button><button id="resume">wm:resume</button>
</div>
<div id="frameWrap"><iframe id="f" title="playable" sandbox="allow-scripts allow-same-origin" allow="autoplay"></iframe></div>
<div id="log"></div>
<script>
const f=document.getElementById('f'),log=document.getElementById('log');
const src=new URLSearchParams(location.search).get('src')||'../../fundfieber.html';
let size=new URLSearchParams(location.search).get('size')||'360x540';
function line(s){log.textContent+=new Date().toISOString().slice(11,23)+'  '+s+'\n';log.scrollTop=1e9;}
function load(){const [w,h]=size.split('x').map(Number);f.width=w;f.height=h;f.style.width=w+'px';f.style.height=h+'px';
  const lang=document.getElementById('lang').value,muted=document.getElementById('muted').checked;
  f.src=src+'?lang='+lang+(muted?'&muted=1':'')+'&t='+Date.now();line('load '+f.src+' @ '+size);}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=b.dataset.s;load();});
document.getElementById('reload').onclick=load;document.getElementById('lang').onchange=load;document.getElementById('muted').onchange=load;
const send=m=>{f.contentWindow.postMessage(m,'*');line('-> '+JSON.stringify(m));};
document.getElementById('mute').onclick=()=>send({type:'wm:mute',muted:true});
document.getElementById('unmute').onclick=()=>send({type:'wm:mute',muted:false});
document.getElementById('pause').onclick=()=>send({type:'wm:pause'});
document.getElementById('resume').onclick=()=>send({type:'wm:resume'});
window.addEventListener('message',e=>{if(e.source===f.contentWindow){line('<- '+JSON.stringify(e.data));(window.__msgs=window.__msgs||[]).push(e.data);}});
load();
</script></body></html>
