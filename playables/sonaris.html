  function project(pos) {

  }

    } else { nav.style.opacity = 0; num.style.display = "none"; }
  }
  function showResult() {

    $("r-title").innerHTML = ""; $("r-title").appendChild(document.createTextNode(t[0])); var b = document.createElement("b"); b.textContent = t[1]; $("r-title").appendChild(b);
    $("s-rings").textContent = round.hits + "/" + GOAL; $("s-shells").textContent = String(round.shells); $("s-time").textContent = Math.round(round.elapsed) + " s";
    $("result").classList.add("show"); requestAnimationFrame(function () { requestAnimationFrame(function () { $("result").classList.add("in"); }); });
    $("cta-top").classList.add("pulse"); coach(false);
  }
  function again() { $("result").classList.remove("in", "show"); $("cta-top").classList.remove("pulse"); $("objective").classList.remove("away"); reset(); cue("ui_tap"); }
  function openStore() {

    window.open(STORE, "_blank", "noopener");
  }

  /* ---------- Eingabe: Stick links, Kamera rechts, vier Tasten ---------- */
  function touched() { taps++; wake(); coach(false); }
  function setStick(x, y) {
    var r = $("stick").getBoundingClientRect(), R = r.width * .38, dx = (x - stick.ox) / R, dy = (y - stick.oy) / R, l = Math.sqrt(dx * dx + dy * dy);

  }

  function move(ev) {

    else if (ev.pointerId === look.id) {

      look.x = ev.clientX; look.y = ev.clientY; lookHold = 1.6; lastInput = player.clock;
    }
  }
  function up(ev) {

    if (ev.pointerId === look.id) look.id = null;
  }
  function hold(id, on, off) {

    e.addEventListener("pointerdown", function (ev) { ev.preventDefault(); ev.stopPropagation(); touched(); pid = ev.pointerId; try { e.setPointerCapture(pid); } catch (x) {} e.classList.add("on"); lastInput = player.clock; auto = false; on(); });

    e.addEventListener("pointerup", end); e.addEventListener("pointercancel", end);
  }
  var KEYS = { KeyW: "fwd", ArrowUp: "fwd", KeyS: "back", ArrowDown: "back", KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right", Space: "rise", ControlLeft: "dive", KeyC: "dive" };

    window.addEventListener("pointerdown", down, { passive: false });
    window.addEventListener("pointermove", move, { passive: false });
    window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
    window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    hold("b-up", function () { vertical = 1; startRound(); }, function () { vertical = 0; });
    hold("b-down", function () { vertical = -1; startRound(); }, function () { vertical = 0; });
    hold("b-dash", function () { startRound(); dash(); });
    hold("b-echo", function () { sendEcho(); });
    window.addEventListener("keydown", function (e) {
      if (e.repeat) return;

      if (e.code === "ShiftLeft" || e.code === "ShiftRight") { touched(); lastInput = player.clock; auto = false; startRound(); dash(); }
      if (e.code === "KeyE") { touched(); sendEcho(); }
    });
    window.addEventListener("keyup", function (e) { if (KEYS[e.code]) keys[KEYS[e.code]] = false; });
    $("snd").addEventListener("click", function () { wake(); setSound(!soundOn); });
    $("cta-top").addEventListener("click", openStore); $("r-cta").addEventListener("click", openStore); $("r-again").addEventListener("click", again);
    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", function () { if (document.hidden) { if (ctx) ctx.suspend(); } else if (!paused && ctx) ctx.resume().catch(function () {}); last = 0; });

  /* ---------- Texte und Start ---------- */

    $("cta-top").lastChild.textContent = L("play"); $("cta-top").setAttribute("aria-label", L("cta"));
    $("obj-eyebrow").textContent = L("eyebrow"); $("obj-title").textContent = L("title"); $("obj-text").textContent = L("goal");
    $("air-label").textContent = L("air"); $("stick-label").textContent = L("swim").toUpperCase();
    $("b-up").innerHTML = svg('<path d="M12 20V5M6 11l6-6 6 6"/>') + "<span>" + L("up") + "</span>";
    $("b-down").innerHTML = svg('<path d="M12 4v15M6 13l6 6 6-6"/>') + "<span>" + L("down") + "</span>";
    $("b-dash").innerHTML = svg('<path d="M13 3 6 13.5h5L10 21l8-11h-5z"/>') + '<span>Dash</span><div id="dots"><i></i><i></i><i></i></div>';
    $("b-echo").innerHTML = svg('<circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 6.5a5.5 5.5 0 1 1-5.5 5.5M12 3a9 9 0 1 1-9 9"/>') + "<span>Echo</span>";
    $("l-rings").textContent = L("rings"); $("l-shells").textContent = L("shells"); $("l-time").textContent = L("time");
    $("r-pitch").textContent = L("pitch"); $("r-cta").textContent = L("cta"); $("r-again").textContent = L("again");
    $("ad").textContent = L("ad"); $("snd").setAttribute("aria-label", L("sound"));
    document.title = "SONARIS · " + L("now");

  }
  var last = 0, readySent = false, frames = 0, slow = 0;

  }
  texts();
  window.SONARIS_AD = { state: function () { return { state: round.state, hits: round.hits, shells: round.shells, remaining: round.remaining, auto: auto, pos: player.pos.slice(), webgl: !!gl, sounds: Object.keys(buffers).length, soundOn: soundOn, paused: paused, clock: player.clock, echo: echo.t }; },
    /* nur zum Prüfen: rechnet die Welt ohne Bildwechsel weiter */
    advance: function (seconds) { for (var i = 0, n = Math.round(seconds * 60); i < n; i++) step(1 / 60); if (gl) draw(performance.now() / 1000); hud(false); } };

    $("cta-top").addEventListener("click", openStore); $("r-cta").addEventListener("click", openStore); $("r-again").style.display = "none"; $("stats").style.display = "none";

    return;
  }
  setup(); fish = makeFish(); reset(); bind(); resize();
  if (Q.get("auto") === "1") { lastInput = -1e9; auto = true; startRound(); }   /* auto=1 nur zum Prüfen */
