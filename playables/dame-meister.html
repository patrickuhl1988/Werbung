:root{--bg:#F5F0E5;--card:#EBDFC6;--card2:#E6D6B6;--ink:#192F2D;--ink2:#45584F;--ink3:#8B7D69;--green:#206A65;--green2:#174F4B;--gold:#C9A84C;--gold2:#E2C66B;--red:#C24E3A;--hintc:#4A8C3F}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body:before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 70% at 85% 8%,#e9d7b04d,transparent 60%),radial-gradient(90% 60% at 0% 100%,#d9c49a40,transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--green);outline-offset:3px}button:disabled{cursor:default;opacity:.4}[hidden]{display:none!important}
.serif{font-family:Fraunces,Georgia,serif;font-weight:700}
main{width:100%;max-width:480px;height:100svh;min-height:100svh;margin:auto;padding:max(14px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;overflow:hidden}
header{display:flex;align-items:center;gap:8px}.brand{font-size:23px;letter-spacing:-.6px;line-height:1;flex:1;white-space:nowrap}.ad-label{font-size:9px;font-weight:600;letter-spacing:1.1px;color:var(--ink2);background:#ffffff8c;border:1px solid #fff;border-radius:99px;padding:6px 10px;white-space:nowrap}
.sound{display:grid;place-items:center;flex:none;width:34px;height:32px;padding:5px;background:#ffffff8c;border:1px solid #fff;border-radius:11px}.sound svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sound .off{display:none}.sound.muted .off{display:block}.sound.muted .on{display:none}
.intro{display:flex;flex-direction:column;gap:9px}
h1{margin:2px 0 0;font-size:clamp(28px,8.4vw,38px);letter-spacing:-1.2px;line-height:1.02;text-wrap:balance}
.goal{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 14px}
.bulb{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold2);color:var(--ink)}.bulb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.goal-text{flex:1;min-width:0}.goal-text strong{display:block;font-size:17px;line-height:1.15;letter-spacing:-.3px}.goal-text span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.progress{flex:none;text-align:right;font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--ink2)}.dots{display:flex;gap:4px;justify-content:flex-end;margin-top:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#19302d26}.dots i.on{background:var(--green)}.dots i.done{background:var(--gold)}
.game{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}

.piece.sel:before{transform:translateY(-4%) scale(1.04);filter:drop-shadow(0 4px 4px #0005)}
.piece svg{position:absolute;inset:18% 18% 20%;width:64%;height:62%;overflow:visible}
.piece.taken{opacity:.38;transition:transform .2s,opacity .2s}.piece.gone{opacity:0;transform:translate(calc(var(--c)*100%),calc(var(--r)*100%)) scale(.6);transition:opacity .25s,transform .25s}
.piece.crowned svg{animation:crown .5s cubic-bezier(.2,1.6,.4,1)}@keyframes crown{from{transform:scale(.2);opacity:0}}
.result{position:absolute;z-index:20;left:50%;top:50%;width:min(88%,330px);transform:translate(-50%,-50%);text-align:center;background:#FBF6EC;border-radius:24px;padding:20px 20px 18px;box-shadow:0 18px 48px #192f2d40,0 0 0 1px #fff;animation:appear .35s ease-out}
.result .badge{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:var(--green);color:#F5F0E5;font-size:26px}.result.lost .badge{background:var(--card2);color:var(--ink)}
.result h2{margin:0 0 6px;font-size:26px;letter-spacing:-.6px;line-height:1.05}.result p{margin:0 0 14px;font-size:13px;line-height:1.45;color:var(--ink2)}
.result .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn2{border:0;border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;background:var(--card);color:var(--ink)}.btn2.primary{background:var(--green);color:#F5F0E5}
.confetti{position:absolute;inset:0;overflow:hidden;border-radius:24px;pointer-events:none}.confetti i{position:absolute;left:var(--x);top:-12px;width:7px;height:10px;border-radius:2px;background:var(--c);animation:confetti 1.5s var(--d) ease-out both}
@keyframes confetti{to{transform:translateY(260px) rotate(260deg);opacity:0}}@keyframes appear{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}}
.controls{display:flex;flex-direction:column;gap:8px}
.status{min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.3;color:var(--ink);padding:0 6px}
.lead{font-size:12px;color:var(--ink2);text-align:center;margin-top:-6px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tools button{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #fff9;background:var(--card);border-radius:14px;min-height:44px;font-size:13px;font-weight:600;padding:6px}.tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#hint .ic{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold2)}#hint .ic svg{width:15px;height:15px}
.cta{width:100%;min-height:54px;border:0;border-radius:18px;background:var(--green);color:#F5F0E5;display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;letter-spacing:-.3px;box-shadow:0 4px 0 var(--green2),0 10px 22px #206a6533;position:relative}.cta svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green2)}
.cta.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 4px 0 var(--green2),0 0 0 7px #206a6533}}
.foot{margin:6px 0 0;text-align:center;font-size:11px;color:var(--ink3)}
.shake{animation:shake .25s}@keyframes shake{25%{translate:-4px}75%{translate:4px}}
@media(max-height:700px) and (orientation:portrait){main{gap:7px;padding-top:max(10px,env(safe-area-inset-top))}h1{font-size:27px}.goal{padding:8px 12px}.bulb{width:32px;height:32px}.goal-text strong{font-size:15px}.goal-text span{font-size:11px}.status{min-height:28px;font-size:13px}.tools button{min-height:38px}.cta{min-height:48px;font-size:18px}.foot{display:none}}
@media(max-height:600px) and (orientation:portrait){h1{display:none}.brand{font-size:20px}.ad-label{font-size:8px;padding:5px 8px}.lead{display:none}.tools button{min-height:34px;font-size:12px}.tools .lbl{display:none}.cta{min-height:42px;font-size:16px;border-radius:14px}.status{font-size:12px;min-height:24px}}
@media(max-width:350px){main{padding-left:12px;padding-right:12px}.ad-label{display:none}.goal{gap:9px}.progress .lbl{display:none}}
@media(orientation:landscape) and (min-width:560px){main{max-width:1040px;height:100svh;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto 1fr auto auto;column-gap:26px;row-gap:9px;padding:max(12px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
header{grid-column:1;grid-row:1}.intro{grid-column:1;grid-row:2}.controls{grid-column:1;grid-row:4}footer{grid-column:1;grid-row:5}
.game{grid-column:2;grid-row:1/6;width:calc(100svh - 24px);height:calc(100svh - 24px);max-width:58vw;max-height:58vw;align-self:center}
h1{font-size:clamp(24px,4.4vw,36px)}.brand{font-size:20px}.goal-text strong{font-size:15px}.cta{min-height:46px;font-size:17px}.tools button{min-height:38px}}
@media(orientation:landscape) and (min-width:560px) and (max-height:420px){h1{font-size:25px}.lead{display:none}.foot{display:none}.status{min-height:26px;font-size:12px}.tools button{min-height:34px}.goal{padding:7px 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return null;
      context = new Audio();
      for (const name of Object.keys(assets)) bufferFor(name).catch(() => {});
    }
    return context.resume();
  }
  async function play(name) {
    if (!enabled || paused || document.hidden) return;
    const token = epoch;
    try {
      const resume = unlock();
      if (!context) return;
      await resume;
      const buffer = await bufferFor(name);
      if (!enabled || paused || document.hidden || token !== epoch || context.state !== 'running') return;
      const source = context.createBufferSource(), gain = context.createGain();
      source.buffer = buffer;
      gain.gain.value = levels[name] * master;
      source.connect(gain); gain.connect(context.destination);
      source.onended = () => { playing.delete(source); source.disconnect(); gain.disconnect(); };
      playing.add(source);
      source.start();
      toggle.setAttribute('data-last-sound', name);
    } catch { /* Ton darf das Spiel nie aufhalten. */ }
  }
  function stop() {
    epoch++;
    for (const source of playing) { try { source.stop(); } catch {} }
    playing.clear();
  }
  function leave() { stop(); if (context) context.suspend().catch(() => {}); }
  function setMuted(muted) { enabled = !muted; if (muted) stop(); update(); }
  function setPaused(value) { paused = value; if (value) leave(); }
  toggle.onclick = () => { enabled = !enabled; if (!enabled) stop(); update(); if (enabled) play('button'); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) leave(); });
  window.addEventListener('pagehide', leave);
  update();
  return {play, stop, setMuted, setPaused};
})();

const PUZZLES=["w....b.b.bb..Wb.b..w.b...ww.w.ww.|1|2|24-39,8-17","w...b.....bbwwbb....ww..w....w...|2|2|23-14,21-30,39-17,7-21","w.....bb..b.bb.....wb.......ww.wW|2|2|55-46,39-53,62-21,24-33"];
const CROWN={w:['#C9A84C','#8A6C24'],b:['#E2C66B','#8A6C24']};
const crownSvg=k=>`<svg viewBox="28 30 44 38" aria-hidden="true"><g fill="${CROWN[k][0]}" stroke="${CROWN[k][1]}" stroke-linejoin="round"><path stroke-width="1.6" d="M33 57 L33 40 L41.5 48 L50 36 L58.5 48 L67 40 L67 57 Z"/><path stroke-width="1.4" d="M32 57.5 h36 a2.5 2.5 0 0 1 2.5 2.5 v2.5 a2.5 2.5 0 0 1 -2.5 2.5 h-36 a2.5 2.5 0 0 1 -2.5 -2.5 v-2.5 a2.5 2.5 0 0 1 2.5 -2.5 z"/><circle stroke-width="1.2" cx="33" cy="39" r="3"/><circle stroke-width="1.2" cx="50" cy="34.5" r="3.4"/><circle stroke-width="1.2" cx="67" cy="39" r="3"/></g></svg>`;
const FILES='abcdefgh';const name=sq=>FILES[sq%8]+(8-Math.floor(sq/8));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=()=>!!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
let level=0,P,state,start,used=0,undoStack=[],line=[],selected=-1,hintMove=null,last=null,busy=false,phase='play',touched=false,paused=false,cleared=new Set();
const pieceEls=new Map();let layer,marks;
function host(msg){try{if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify(msg));return true;}if(window.parent!==window){window.parent.postMessage(msg,'*');return true;}}catch{}return false;}
function legal(){return E.generateMoves(state);}
function gained(){return E.lead(state.board,P.player)-E.lead(start.board,P.player);}
function onLine(){return line.every((m,i)=>P.solution[i]&&P.solution[i].from===m.from&&P.solution[i].to===m.to);}
function bestFor(from,to){let best=null;for(const m of legal())if(m.from===from&&m.to===to&&(!best||m.captures.length>best.captures.length))best=m;return best;}
function buildBoard(){const b=$('board');b.replaceChildren();for(let sq=0;sq<64;sq++){const r=Math.floor(sq/8),c=sq%8,dark=(r+c)%2===1;const el=document.createElement(dark?'button':'div');el.className='sq'+(dark?' d':'');if(dark){el.dataset.sq=sq;el.onclick=()=>tap(sq);}b.append(el);}
layer=document.createElement('div');layer.className='layer';marks=document.createElement('div');marks.className='layer';b.append(marks,layer);
const f=$('frame');for(let i=0;i<8;i++){const rk=document.createElement('span');rk.className='coord rank';rk.textContent=8-i;rk.style.top=`calc(4.2% + ${(i+.5)/8} * 91.6%)`;const fl=document.createElement('span');fl.className='coord file';fl.textContent=FILES[i];fl.style.left=`calc(4.2% + ${(i+.5)/8} * 91.6%)`;f.append(rk,fl);}}
function place(el,sq){el.style.setProperty('--r',Math.floor(sq/8));el.style.setProperty('--c',sq%8);}
function renderPieces(){layer.replaceChildren();pieceEls.clear();state.board.forEach((p,sq)=>{if(!p)return;const el=document.createElement('div');const k=p.player==='white'?'w':'b';el.className='cell piece '+k+(p.kind==='king'?' king':'');if(p.kind==='king')el.innerHTML=crownSvg(k);place(el,sq);layer.append(el);pieceEls.set(sq,el);});}
function selectable(){return [...new Set(legal().map(m=>m.from))];}
function renderMarks(){marks.replaceChildren();const add=(sq,cls)=>{const el=document.createElement('div');el.className='cell '+cls;place(el,sq);marks.append(el);};
if(last){add(last.from,'m-last');add(last.to,'m-last');}
if(hintMove){add(hintMove.from,'m-hint');add(hintMove.to,'m-hint');}
if(selected>=0){add(selected,'m-sel');const ms=legal().filter(m=>m.from===selected);for(const m of ms){add(m.to,m.captures.length?'m-cap':'m-dot');for(const c of m.captures)add(c,'m-threat');}}
else if(phase==='play'&&!busy&&!touched)for(const sq of selectable())add(sq,'m-can');
pieceEls.forEach((el,sq)=>el.classList.toggle('sel',sq===selected));
document.querySelectorAll('.sq.d').forEach(b=>{const sq=+b.dataset.sq,p=state.board[sq];b.setAttribute('aria-label',`${t.sq} ${name(sq)}${p?', '+t[(p.player==='white'?'w':'b')+(p.kind==='king'?'k':'m')]:''}`);b.setAttribute('aria-pressed',String(sq===selected));});}
function renderUi(){const g=gained();$('headline').textContent=t.heads[level]||t.heads[0];$('goal').textContent=t.goal(P.gain,P.moves);$('goalSub').textContent=t.sub;$('stage').textContent=`${t.stage} ${level+1}/${PUZZLES.length}`;
$('dots').replaceChildren();PUZZLES.forEach((_,i)=>{const d=document.createElement('i');d.className=cleared.has(i)?'done':i===level?'on':'';$('dots').append(d);});
$('lead').textContent=t.lead(g,P.gain);$('undo').disabled=busy||!undoStack.length;$('hint').disabled=busy||phase!=='play';$('reset').disabled=busy;}
function render(){renderPieces();renderMarks();renderUi();}
function say(s){$('status').textContent=s;}
async function animate(move){const el=pieceEls.get(move.from);if(!el)return;el.classList.add('lift');pieceEls.delete(move.from);
const caps=move.captures.map(c=>pieceEls.get(c)).filter(Boolean);const quick=reduced();
for(let i=0;i<move.path.length;i++){place(el,move.path[i]);if(caps[i])caps[i].classList.add('taken');if(!quick)await wait(move.captures.length?230:210);if(move.captures.length)sfx.play('capture');}
if(!move.captures.length)sfx.play('move');for(const c of caps)c.classList.add('gone');if(!quick&&caps.length)await wait(220);}
async function playMove(move,bySide){busy=true;selected=-1;hintMove=null;renderMarks();renderUi();await animate(move);
const wasKing=state.board[move.from]?.kind==='king';state=E.applyMove(state,move);last={from:move.from,to:move.to};line.push({from:move.from,to:move.to});render();
if(move.promotes&&!wasKing){const el=pieceEls.get(move.to);el?.classList.add('crowned');sfx.play('promote');}busy=false;}
async function tap(sq){if(busy||paused||phase!=='play')return;if(!touched){touched=true;}const p=state.board[sq];
if(p&&p.player===P.player){if(sq===selected){selected=-1;say(t.ready);renderMarks();return;}const ms=legal().filter(m=>m.from===sq);
if(!ms.length){sfx.play('invalid');say(legal().some(m=>m.captures.length)?t.must:t.stuck);shake(sq);selected=-1;renderMarks();return;}
selected=sq;hintMove=hintMove&&hintMove.from===sq?hintMove:null;sfx.play('select');say(t.selected);renderMarks();return;}
if(selected<0){sfx.play('invalid');say(legal().some(m=>m.captures.length)?t.must:t.ready);renderMarks();return;}
const move=bestFor(selected,sq);if(!move){sfx.play('invalid');say(t.notTarget);shake(sq);return;}
undoStack.push({state,used,line:line.slice(),last});used++;await playMove(move,'player');
if(state.status.kind==='win'&&state.status.winner===P.player||gained()>=P.gain)return finish(true);
if(used>=P.moves||state.status.kind!=='playing')return finish(false);
busy=true;say(t.think);renderUi();await wait(reduced()?150:520);const reply=E.defend(state);busy=false;
if(!reply)return finish(gained()>=P.gain);await playMove(reply,'defense');
if(state.status.kind!=='playing')return finish(state.status.kind==='win'&&state.status.winner===P.player);
say(t.your(P.moves-used));renderUi();}
function shake(sq){const b=document.querySelector(`.sq[data-sq="${sq}"]`);if(!b)return;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
function finish(won){phase=won?'won':'lost';selected=-1;hintMove=null;render();const r=$('result');r.hidden=false;r.className='result'+(won?'':' lost');$('confetti').replaceChildren();
if(won){cleared.add(level);sfx.play('solved');host({type:'wm:cleared',level:level+1,moves:used});const all=cleared.size>=PUZZLES.length&&level===PUZZLES.length-1;
$('badge').textContent='✓';$('resTitle').textContent=all?t.doneT:t.won;$('resText').textContent=all?t.doneText:t.wonText(gained());$('resMain').textContent=all?t.cta:t.next;$('resAlt').textContent=all?t.again:t.retry;
$('resMain').onclick=all?()=>openStore():()=>{sfx.play('button');level=(level+1)%PUZZLES.length;load();};$('resAlt').onclick=()=>{sfx.play('button');if(all){cleared.clear();level=0;}load();};
const cols=['#C9A84C','#206A65','#C25E4A','#E2C66B'];for(let n=0;n<20;n++){const i=document.createElement('i');i.style.setProperty('--x',(n*37%100)+'%');i.style.setProperty('--c',cols[n%4]);i.style.setProperty('--d',(n%5)*.07+'s');$('confetti').append(i);}
say(all?t.doneT:t.won);if(all)$('cta').classList.add('pulse');}
else{sfx.play('invalid');$('badge').textContent='↺';$('resTitle').textContent=t.lost;$('resText').textContent=t.lostText;$('resMain').textContent=t.retry;$('resAlt').textContent=t.tip;
$('resMain').onclick=()=>{sfx.play('button');load();};$('resAlt').onclick=()=>{sfx.play('button');load();showHint();};say(t.lost);}
renderUi();}
function showHint(){if(busy||phase!=='play')return;let m=null;if(onLine()){const s=P.solution[line.length];if(s)m=bestFor(s.from,s.to);}if(!m)m=E.defend(state);if(!m){say(t.offLine);return;}
hintMove={from:m.from,to:m.to};selected=m.from;touched=true;say(t.hint);renderMarks();}
function load(){const p=E.decode(PUZZLES[level]);P=p;state=p.state;start=p.state;used=0;undoStack=[];line=[];selected=-1;hintMove=null;last=null;busy=false;phase='play';touched=false;
$('result').hidden=true;$('cta').classList.toggle('pulse',false);render();say(t.ready);}
function openStore(){sfx.stop();if(host({type:'wm:cta',url:STORE}))return;if(window.mraid?.open){window.mraid.open(STORE);return;}if(window.FbPlayableAd?.onCTAClick){window.FbPlayableAd.onCTAClick();return;}if(window.dapi?.openStoreUrl){window.dapi.openStoreUrl();return;}window.open(STORE,'_blank','noopener');}
$('undo').onclick=()=>{if(busy||!undoStack.length)return;sfx.play('button');const s=undoStack.pop();state=s.state;used=s.used;line=s.line;last=s.last;selected=-1;hintMove=null;phase='play';$('result').hidden=true;render();say(used?t.your(P.moves-used):t.ready);};
$('hint').onclick=()=>{sfx.play('button');showHint();};
$('reset').onclick=()=>{if(busy)return;sfx.play('button');load();};
$('cta').onclick=openStore;
function onHost(e){let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d);}catch{return;}}if(!d||typeof d.type!=='string')return;
if(d.type==='wm:mute')sfx.setMuted(!!d.muted);else if(d.type==='wm:pause'){paused=true;sfx.setPaused(true);}else if(d.type==='wm:resume'){paused=false;sfx.setPaused(false);}}
window.addEventListener('message',onHost);document.addEventListener('message',onHost);
for(const [id,v] of Object.entries({brand:t.brand,adLabel:t.ad,undoLabel:t.undo,hintLabel:t.hintL,resetLabel:t.reset,ctaLabel:t.cta,footnote:t.foot}))$(id).textContent=v;
for(const [id,v] of Object.entries({undo:t.undo,hint:t.hintL,reset:t.reset}))$(id).setAttribute('aria-label',v);
buildBoard();load();
requestAnimationFrame(()=>requestAnimationFrame(()=>host({type:'wm:ready',game:'dame-meister'})));
})();
</script></body></html>
