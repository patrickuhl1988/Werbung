button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #245bf5;outline-offset:5px}button:disabled{cursor:default;opacity:.45}button:active:not(:disabled){filter:brightness(.96)}[hidden]{display:none!important}
main{width:100%;max-width:490px;min-height:100svh;margin:auto;padding:22px 24px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:15px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:22px;font-weight:950;letter-spacing:-1.2px;font-style:italic;line-height:.9}.brand span{color:#245bf5}.ad-label{font-size:9px;font-weight:750;letter-spacing:1.1px;background:#ffffffb8;padding:7px 10px;border:1px solid #fff9;border-radius:100px}
.intro{text-align:center;margin-top:5px}h1{font-size:clamp(28px,7.7vw,39px);letter-spacing:-1.5px;line-height:1.06;margin:0 auto 10px;font-weight:850;text-wrap:balance;max-width:400px}.intro p{font-size:13px;color:#2f4b6c;margin:0;line-height:1.5}
.progress{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px}.pill{font-size:10px;font-weight:800;letter-spacing:1.6px;background:#ffffffc7;box-shadow:0 3px 12px #496c9f14;border:1px solid #fff;border-radius:100px;padding:8px 13px}.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;background:#ffffffb3;border-radius:100%}.dots i.active{background:#245bf5;box-shadow:0 0 0 3px #ffffff80}
.game{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:260px}
.board{--ball:48px;--tube:64px;--gap:31px;display:flex;align-items:flex-end;justify-content:center;gap:var(--gap);position:relative;padding:35px 18px 30px;width:100%;isolation:isolate}.board.dense{--ball:34px;--tube:46px;--gap:15px}
.tube{--seal:#245bf5;position:relative;flex:none;width:var(--tube);height:calc(var(--ball)*4 + 32px);border:0;padding:0;background:transparent;outline-offset:5px;isolation:isolate}
.tube .shadow{position:absolute;left:-36%;right:-36%;bottom:calc(var(--tube)*-.58);height:calc(var(--tube)*.42);border-radius:50%;background:radial-gradient(closest-side,#17354f4d,#17354f00);z-index:-2;pointer-events:none}
.tube .flash{position:absolute;left:-8px;right:-8px;top:-5px;bottom:-7px;border-radius:calc(var(--tube)*.5);background:#ff4040bf;opacity:0;z-index:-1;pointer-events:none}
.tube .ring{position:absolute;inset:-6px;border:3px solid var(--seal);border-radius:calc(var(--tube)*.5 + 6px);opacity:0;z-index:5;pointer-events:none}

  for(let layer=0;layer<layers;layer++)after(layer*timing.layerGap+F.FILL_FALL_MAX_MS*(layer?.6:.85),()=>sfx.play('drop',{gain:.5,passive:true}),'fill');
}
function skipFill(){if(!filling)return;const f=filling;filling=null;cancelGroup('fill');f.items.forEach(f.rest);}

// ── Flug von Röhre zu Röhre ─────────────────────────────────────────────────
const ghosts=new Set();
function endGhost(g){if(!ghosts.delete(g))return;cancel(g.tr);g.el.remove();g.real.style.visibility='';}
function settleGhosts(){for(const g of [...ghosts])endGhost(g);}
function dip(i){
  const tube=ui[i],p=tube.pose;tube.dip.forEach(cancel);
  tube.dip=[run(60,e=>{const k=outQuad(e/60);p.sy=1-.018*k;p.y=2*k;applyPose(tube);},{end(){tube.dip=[spring(v=>{p.sy=v;applyPose(tube);},.982,1,10,280,.55),spring(v=>{p.y=v;applyPose(tube);},2,0,11,260,.55)];}})];
}
function transfer(from,to,next){
  const count=board[from].length-next[from].length,c=board[from].at(-1),dstLen=board[to].length,srcLen=board[from].length;
  busy=true;say(t.moving);
  let g=null,legs=null;
  if(motion){
    g=metrics();const protrude=F.hoverProtrude(g.size,g.room),inset=(g.W-g.size)/2,topSlotY=g.bottom-11-(srcLen-1)*g.step-g.size;
    const held=lift.i===from,hovering=held&&Math.abs(lift.y+lift.px)<5;
    legs=F.planFlight({count,fromX:g.left(from)+inset,toX:g.left(to)+inset,topSlotY,step:g.step,hoverY:g.top-protrude,overY:g.top-protrude,endY:g.bottom-11-dstLen*g.step-g.size,ceilY:4,lifted:hovering});
    // Sehr schneller Doppeltipp: die Kugel steigt noch – der Flug übernimmt von dort.
    if(held&&!hovering)legs[0].slotY=topSlotY+lift.y;
  }
  cancel(lift.tr);lift.i=-1;lift.el=null;
  history.push(clone(board));board=next;selected=-1;landing=to;
  for(let k=0;k<count;k++)ui[from].balls.pop().remove();
  const reals=[];for(let k=0;k<count;k++){const el=mkBall(c,dstLen+k);ui[to].el.append(el);ui[to].balls.push(el);reals.push(el);}
  syncTop(from);syncTop(to);updateSelection();syncTools();
  if(!motion){sfx.play('drop');landed(to);return Promise.resolve();}
  return new Promise(resolve=>{
    const dir=legs[0].toX>=legs[0].fromX?1:-1,size=g.size;
    legs.forEach((leg,k)=>{
      const real=reals[k];real.style.visibility='hidden';
      const el=mkBall(c),glint=document.createElement('i');el.className='ball flying';el.style.width=el.style.height=size+'px';el.append(glint);
      const ghost={el,real,tr:null};
      const paint=e=>{
        let y=F.flightY(leg,e),sq=-.07*F.flightStretch(leg,e);const since=e-leg.landAt;
        // Aufsetzen: Unterkante bleibt stehen, Kugel staucht und hüpft minimal nach.
        if(since>=0){const p=since/SETTLE;sq=F.impactSquash(p);y+=sq*size/2-F.impactHop(p,size);}
        el.style.transform=`translate(${F.flightX(leg,e)}px,${y}px) rotate(${F.flightTilt(leg,e)*TILT_DEG*dir}deg) scale(${1+sq*.6},${1-sq})`;
        const q=since/220;glint.style.opacity=q<=0||q>=1?0:.85*(1-q);glint.style.transform=`scale(${.4+clamp(q,0,1)*.9})`;
      };
      paint(0);document.body.append(el);ghosts.add(ghost);
      ghost.tr=run(leg.landAt+SETTLE,paint,{group:'ghost',end:()=>endGhost(ghost)});
      after(leg.landAt,()=>dip(to));
    });
    after(Math.max(0,legs[0].landAt-70),()=>sfx.play('drop'));
    if(dstLen>0){const below=ui[to].balls[dstLen-1];after(legs[0].landAt,()=>run(SETTLE,e=>givePose(below,e/SETTLE,size),{end(){below.style.transform='';}}));}
    after(F.flightLandMs(legs),()=>{landed(to);resolve();});
  });
}
function landed(to){
  busy=false;landing=-1;say(t.continue);
  const full=isFull(board[to]);won=solved(board);updateSelection();
  if(full){seal(to);if(!won)sfx.play('tube');}
  if(won){sfx.play('win');host({type:'wm:cleared',level:level+1,moves:history.length});say(level===2?t.done:t.win);finale();}
  syncTools();
}

// ── Fertige Röhre: Puls, Deckel, Lichtring, kleines Feuerwerk ───────────────
function seal(i){
  if(!motion)return;
  const tube=ui[i],p=tube.pose,color=colors[board[i][0]],lid=tube.lid,ring=tube.ring;
  lid.style.opacity=0;
  run(150,e=>{p.s=1+.1*inOutQuad(e/150);applyPose(tube);},{end(){spring(v=>{p.s=v;applyPose(tube);},1.1,1,8,200,1);}});
  spring(v=>{lid.style.opacity=clamp(v,0,1);lid.style.transform=`translateY(${(1-v)*-30}px) scale(${.72+v*.28})`;},0,1,11,170,.7,70);
  run(100,e=>{p.x=seq(e,0,[[30,-1.5],[30,1.5],[40,0]]);applyPose(tube);},{delay:190,end(){p.x=0;applyPose(tube);}});
  run(650,e=>{const r=outCubic(e/650);ring.style.opacity=(1-r)*.55;ring.style.transform=`scale(${1+r*.32})`;},{end(){ring.style.opacity=0;}});
  const g=metrics();miniFirework(g.left(i)+g.W/2,Math.max(g.top-30,34),color);
}

// ── Feuerwerk auf einer Zeichenfläche über allem ────────────────────────────
const fx=[];let fxDirty=false,ctx=null,vw=0,vh=0,dpr=1,fireCount=0;
function sizeFx(){const c=$('fx');if(!motion||!c.getContext)return;dpr=Math.min(window.devicePixelRatio||1,2);vw=window.innerWidth;vh=window.innerHeight;c.width=Math.round(vw*dpr);c.height=Math.round(vh*dpr);ctx=c.getContext('2d');}
function drawFx(){
  if(!ctx||(!fx.length&&!fxDirty))return;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);
  for(let n=fx.length-1;n>=0;n--){const f=fx[n],u=(now-f.t0)/f.dur;if(u>=1)fx.splice(n,1);else if(u>0)f.draw(u);}
  ctx.globalAlpha=1;fxDirty=fx.length>0;
}
function dot(x,y,r,color,alpha){if(alpha<=0||r<=0)return;ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function bar(x,y,w,h,rot,color,alpha){if(alpha<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-w/2,-h/2,w,h,Math.min(w,h)/2);else ctx.rect(-w/2,-h/2,w,h);ctx.fill();ctx.restore();}
/** Zwei kurze Raketen zerplatzen in der Kugelfarbe (wie MiniFirework im Spiel, 850 ms). */
function miniFirework(x,y,color){
  if(!ctx)return;
  const shell=(n,dx,dy,from,to,radius)=>({dx,dy,from,to,radius,parts:Array.from({length:n},(_,i)=>({a:i/n*6.2832+(Math.random()-.5)*.35,reach:radius*(.72+Math.random()*.36),size:5+Math.random()*3,color:i%4===1?'#FFFFFF':i%4===3?'#FFE9A6':color}))});
  const side=fireCount++%2?-1:1,shells=[shell(10,0,0,.2,.82,42),shell(7,side*27,-16,.42,1,29)];
  fx.push({t0:now,dur:850,draw(u){shells.forEach((s,n)=>{
    const cx=x+s.dx,cy=y+s.dy,start=Math.max(0,s.from-.2),r=(u-start)/(s.from-start);
    if(r>0&&r<1)bar(cx,cy+44*(1-r)*(1-r),3,12*(1.2-r*.6),0,n?color:'#FFFFFF',.95);
    const f=(u-s.from)/((s.to-s.from)*.45);
    if(f>0&&f<1){const len=s.radius*1.3*(.3+f*.9);bar(cx,cy,len,3,0,'#FFFFFF',(1-f)*.9);bar(cx,cy,len,3,1.5708,'#FFFFFF',(1-f)*.9);}
    const p=(u-s.from)/(s.to-s.from);
    if(p>0&&p<1){const k=1-(1-p)**3,alpha=p<.55?1:(1-p)/.45,scale=1.15-p*.65;for(const q of s.parts)dot(cx+Math.cos(q.a)*q.reach*k,cy+Math.sin(q.a)*q.reach*k+26*p*p,q.size/2*scale,q.color,alpha);}
  });}});kick();
}
/** Sieg-Finale: sechs gestaffelte Salven in den Kugelfarben (wie VictoryFireworks im Spiel). */
function victory(palette){
  if(!ctx)return;
  const plan=[[0,82,14],[260,56,12],[540,112,18],[840,56,12],[1120,82,14],[1420,112,18]],spots=[[.5,.2],[.2,.13],[.8,.17],[.33,.33],[.7,.3],[.5,.11]];
  const k=clamp(Math.min(vw,vh*.7)/390,.55,1.2),shift=Math.floor(Math.random()*palette.length);
  plan.forEach(([at,base,n],i)=>{
    const radius=base*k,margin=Math.min(radius*.6,vw*.2),x=clamp(vw*spots[i][0]+(Math.random()-.5)*30,margin,vw-margin),y=Math.max(radius*.7,vh*spots[i][1]+(Math.random()-.5)*24);
    const color=palette[(i+shift)%palette.length],accent=palette[(i+shift+1)%palette.length];
    const parts=Array.from({length:n},(_,j)=>({a:j/n*6.2832+(Math.random()-.5)*.3,reach:radius*(.7+Math.random()*.4),size:5+Math.random()*4,streak:j%2===0,color:j%5===2?'#FFFFFF':j%3===1?accent:color}));
    after(at,()=>{
      fx.push({t0:now,dur:950,draw(u){
        const r=u/.24;if(r>0&&r<1)bar(x,y+130*k*(1-r)*(1-r),4,22*(1.3-r*.7),0,'#FFFFFF',.9);
        const f=(u-.24)/.228;if(f>0&&f<1)dot(x,y,radius*.25*(.3+f*1.2),color,(1-f)*.4);
        const p=(u-.24)/.76;
        if(p>0&&p<1){const e=1-(1-p)**3,scale=1.2-p*.7;parts.forEach((q,j)=>{const alpha=(p<.65?1:(1-p)/.35)*(p>.6?.75+.25*Math.sin(p*40+j):1);bar(x+Math.cos(q.a)*q.reach*e,y+Math.sin(q.a)*q.reach*e+64*k*p*p,q.size*scale,(q.streak?q.size*2.4:q.size)*scale,q.a+1.5708,q.color,alpha);});}
      }});
      // Der Knall gehört zur Explosion, nicht zum Raketenstart; Glitzern zu jeder zweiten Salve.
      if(i%2===1)after(228,()=>sfx.play('combo',{gain:.5,rate:[1,1.12,.92][i%3]}),'finale');
    },'finale');
  });
}
function showWin(){showingWin=true;$('next').textContent=level===2?t.again:t.next;$('winText').textContent=level===2?t.done:t.winText;$('board').hidden=true;$('win').hidden=false;}
function finale(){
  if(!motion){showWin();return;}
  const token=epoch;victory([...new Set(levels[level].flat())].map(c=>colors[c]));
  after(950,()=>{if(token===epoch)showWin();},'finale');
}

// ── Spielablauf ─────────────────────────────────────────────────────────────
function resetFx(){epoch++;for(const group of ['board','fill','finale'])cancelGroup(group);settleGhosts();lift.i=-1;lift.el=null;lift.tr=null;filling=null;fx.length=0;if(motion)kick();}
async function tap(i){
  if(won||busy)return;
  skipFill();settleGhosts();hints=[];
  if(selected<0){
    if(!board[i].length){sfx.play('invalid');say(t.empty);reject(i,false);return;}
    sfx.play('pick');say(t.selected);setSelected(i);return;
  }
  if(selected===i){say(t.ready);setSelected(-1);return;}
  const from=selected,next=move(board,from,i);
  if(!next){sfx.play('invalid');say(t.invalid);reject(i,true);setSelected(-1,true);return;}
  await transfer(from,i,next);
}
function start(){if(busy)return;resetFx();board=clone(levels[level]);selected=-1;history=[];hints=[];won=false;showingWin=false;landing=-1;say(t.ready);render();if(motion)fillIn();}
$('undo').onclick=()=>{if(busy||!history.length)return;sfx.stop();sfx.play('undo');resetFx();board=history.pop();selected=-1;hints=[];won=false;showingWin=false;say(t.ready);render();};
$('hint').onclick=()=>{if(won||busy)return;sfx.play('button');skipFill();settleGhosts();const path=solve(board);if(path?.length){hints=path[0];say(t.hinted);setSelected(hints[0]);}else say(de?'Starte das Rätsel neu.':'Restart the puzzle.');};
$('reset').onclick=()=>{if(busy)return;sfx.stop();sfx.play('button');start();};$('next').onclick=()=>{if(busy)return;sfx.stop();sfx.play('button');level=(level+1)%levels.length;start();};
$('cta').onclick=()=>{sfx.stop();const url='https://play.google.com/store/apps/details?id=com.patrickuhl.sortrush';if(host({type:'wm:cta',url}))return;if(window.mraid?.open){window.mraid.open(url);return;}if(window.FbPlayableAd?.onCTAClick){window.FbPlayableAd.onCTAClick();return;}if(window.dapi?.openStoreUrl){window.dapi.openStoreUrl();return;}window.open(url,'_blank','noopener');};

// ── Lagune ausrichten: die Stegkante liegt hinter dem unteren Drittel der Röhren ──
function placeScene(){
  const game=$('game'),art=$('art');if(!game.getBoundingClientRect)return;
  const box=game.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight;if(!box.height||!W||!H)return;
  const RATIO=1080/2340,EDGE=.632,edge=box.bottom-34-clamp(box.height*.3,46,110);
  const h=Math.max(W/RATIO,H,edge/EDGE,(H-edge)/(1-EDGE)),w=h*RATIO;
  art.style.cssText=`inset:auto;left:${(W-w)/2}px;top:${edge-EDGE*h}px;width:${w}px;height:${h}px;background-size:100% 100%`;
}
window.addEventListener('resize',()=>{sizeFx();placeScene();});
sizeFx();placeScene();start();requestAnimationFrame(()=>requestAnimationFrame(()=>host({type:'wm:ready',game:'sort-rush'})));
})();
</script></body></html>
