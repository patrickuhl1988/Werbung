</main><script>
(()=>{'use strict';
const de=(new URLSearchParams(location.search).get('lang')||navigator.language||'en').startsWith('de');
const t=de?{head:'Dein kleiner Glücksmoment.',instruction:'Sortiere die Farben. Finde deinen Flow.',ad:'SPIELBARE WERBUNG',stage:'RÄTSEL',undo:'Zurück',hint:'Tipp',reset:'Neustart',cta:'Kostenlos weiterspielen',foot:'Sort Rush · Jetzt bei Google Play',empty:'Wähle eine Röhre mit Kugeln.',invalid:'Gleiche Farbe oder eine leere Röhre wählen.',selected:'Und jetzt: die Zielröhre antippen.',hinted:'Tippe die andere markierte Röhre an.',win:'Perfekt sortiert!',winText:'Ein kleiner Erfolg. Lust auf den nächsten?',next:'Nächstes Rätsel →',again:'Noch einmal spielen',ready:'Tippe eine Röhre an. Los geht’s!',done:'Alle drei geschafft. Bereit für Sort Rush?',moving:'Das passt!',continue:'Weiter so! Wähle eine Röhre.'}:{head:'Your little moment of joy.',instruction:'Sort the colours. Find your flow.',ad:'PLAYABLE AD',stage:'PUZZLE',undo:'Undo',hint:'Hint',reset:'Restart',cta:'Keep playing for free',foot:'Sort Rush · Get it on Google Play',empty:'Choose a tube with balls.',invalid:'Choose the same colour or an empty tube.',selected:'Now tap the destination tube.',hinted:'Tap the other highlighted tube.',win:'Perfectly sorted!',winText:'One little win. Ready for another?',next:'Next puzzle →',again:'Play again',ready:'Tap a tube. Let’s play!',done:'All three solved. Ready for Sort Rush?',moving:'A perfect fit!',continue:'Keep going! Choose a tube.'};
document.documentElement.lang=de?'de':'en';const $=id=>document.getElementById(id);

const clone=b=>b.map(a=>a.slice());
function move(b,f,to){if(f===to||!b[f].length||b[to].length>=4)return null;const c=b[f].at(-1);if(b[to].length&&b[to].at(-1)!==c)return null;const out=clone(b);while(out[f].length&&out[f].at(-1)===c&&out[to].length<4)out[to].push(out[f].pop());return out;}

function host(msg){try{if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify(msg));return true;}if(window.parent!==window){window.parent.postMessage(msg,'*');return true;}}catch{}return false;}
function updateSelection(){board.forEach((balls,i)=>{const el=$('board').children[i+1];el.className='tube'+(selected===i?' selected':'')+(hints.includes(i)?' hint':'')+(selected>=0&&selected!==i&&move(board,selected,i)?' target':'')+(balls.length===4&&balls.every(c=>c===balls[0])?' complete':'');el.setAttribute('aria-pressed',String(selected===i));});}

async function tap(i){if(won||busy)return;hints=[];if(selected<0){if(!board[i].length){$('status').textContent=t.empty;return;}selected=i;$('status').textContent=t.selected;updateSelection();}else if(selected===i){selected=-1;$('status').textContent=t.ready;updateSelection();}else{const from=selected,next=move(board,from,i);if(!next){$('status').textContent=t.invalid;const el=$('board').children[i+1];el.classList.remove('invalid');void el.offsetWidth;el.classList.add('invalid');return;}busy=true;$('undo').disabled=true;$('hint').disabled=true;$('reset').disabled=true;$('status').textContent=t.moving;try{await fly(from,i,next);}catch{}history.push(clone(board));board=next;selected=-1;busy=false;$('status').textContent=t.continue;won=solved(board);if(won){host({type:'wm:cleared',level:level+1,moves:history.length});$('status').textContent=level===2?t.done:t.win;celebrate();}render();}}
