    text("Arrow Puzzle", 432, 110, 44, "800", "#fff", "left");
    // Levelschild
    var label = "LEVEL " + LEVEL + "  ·  " + MOTIF.toUpperCase();
    ctx.font = "800 30px " + FONT; var w = ctx.measureText(label).width + 56;
    ctx.fillStyle = "#ffffff16"; rr(540 - w / 2, 170, w, 56, 28); ctx.fill();
    ctx.strokeStyle = THEME.accent + "99"; ctx.lineWidth = 2; rr(540 - w / 2, 170, w, 56, 28); ctx.stroke();
    text(label, 540, 199, 30, "800", "#fff");
    // Herzen
    for (var i = 0; i < HEARTS_MAX; i++) {
      var x = 540 - (HEARTS_MAX - 1) * 26 + i * 52, y = 262, on = i < hearts, pulse = (!on && i === hearts && now - heartLostAt < 400) ? 1 + (1 - (now - heartLostAt) / 400) * 0.8 : 1;
      ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse); ctx.fillStyle = on ? "#FF5C8A" : "#ffffff22";
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.bezierCurveTo(-22, -8, -14, -26, 0, -14); ctx.bezierCurveTo(14, -26, 22, -8, 0, 10); ctx.fill(); ctx.restore();
    }
    // Federn
    ctx.font = "900 34px " + FONT; var fl = "" + feathers, fw = ctx.measureText(fl).width + 90;
    ctx.fillStyle = "#ffffff16"; rr(1080 - 60 - fw, 236, fw, 54, 27); ctx.fill();
    drawFeather(1080 - 60 - fw + 36, 263, 30, THEME.accent);
    text(fl, 1080 - 60 - fw + 62, 264, 34, "900", THEME.accent, "left");
  }
  function drawFeather(x, y, s, color) {
    ctx.save(); ctx.translate(x - s / 2, y - s / 2); ctx.scale(s / 24, s / 24); ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(20.5, 3.5); ctx.bezierCurveTo(15.5, 3.5, 9.5, 6.5, 7, 12.5); ctx.lineTo(3, 21); ctx.lineTo(4.5, 19.5); ctx.lineTo(11, 13); ctx.lineTo(6, 13.5);
    ctx.bezierCurveTo(9, 8.5, 14, 5.5, 20.5, 3.5); ctx.fill(); ctx.restore();
  }
  function drawBoard() {
    var free = null;
    for (var i = 0; i < N; i++) {
      if (removed[i]) continue;
      var sh = null;
      for (var k = 0; k < shakes.length; k++) if (shakes[k].i === i || shakes[k].blocker === i) sh = shakes[k];
      var dx = 0, col = THEME.ink;
      if (sh) { var u = (now - sh.t0) / 420; if (u < 1) { dx = Math.sin(u * 28) * (1 - u) * cs * 0.35; col = sh.i === i ? "#FF4F6E" : "#FF9AB0"; } }
      ctx.save(); ctx.translate(dx, 0); drawArrow(i, 0, col, 1); ctx.restore();
    }
    for (var f = flights.length - 1; f >= 0; f--) {
      var fl = flights[f], d = flightDur(fl.i), u2 = (now - fl.t0) / d;
      if (u2 >= 1) { flights.splice(f, 1); continue; }
      var s = ease(u2) * tracks[fl.i].exit;
      ctx.shadowColor = THEME.accent; ctx.shadowBlur = cs * 0.6;
      drawArrow(fl.i, s, THEME.accent, u2 > 0.7 ? (1 - u2) / 0.3 : 1, 1.15);
      ctx.shadowBlur = 0;
    }
    return free;
  }
  function drawHint() {
    if (phase !== "play") return;
    var idle = now - lastTap;
    if (idle < (tutorialDone ? 2600 : 900)) { hintArrow = -1; return; }
    if (hintArrow === -1 || removed[hintArrow]) { var fr = freeArrows(); if (!fr.length) return; hintArrow = fr[0]; }
    var z = BOARD.a[hintArrow][1][Math.floor(BOARD.a[hintArrow][1].length / 2)], p = center(z);
    var u = ((idle % 1300) / 1300);
    ctx.strokeStyle = THEME.accent; ctx.lineWidth = 5; ctx.globalAlpha = (1 - u) * 0.9;
    ctx.beginPath(); ctx.arc(p.x, p.y, 20 + 70 * u, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    // Finger
    var press = u < 0.15 ? 0.82 : 1, fx = p.x + 26, fy = p.y + 30 - (u < 0.15 ? 0 : 10);
    ctx.save(); ctx.translate(fx, fy); ctx.scale(press, press);
    var g = ctx.createRadialGradient(0, 0, 4, 0, 0, 36); g.addColorStop(0, "#ffffffee"); g.addColorStop(0.6, "#ffffff55"); g.addColorStop(1, "#ffffff00");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fill(); ctx.restore();
    if (!tutorialDone) {
      ctx.fillStyle = "#000000aa"; rr(140, 330, 800, 96, 28); ctx.fill();
      text("Tap an arrow with a clear path ahead", 540, 378, 38, "700", "#fff");
    }
  }
  function drawCounterAndProgress() {
    var left = 0; for (var i = 0; i < N; i++) if (!removed[i]) left++;
    var p = (N - left) / N;
    ctx.fillStyle = "#ffffff1a"; rr(150, 1600, 780, 16, 8); ctx.fill();
    var g = ctx.createLinearGradient(150, 0, 930, 0); g.addColorStop(0, THEME.ink); g.addColorStop(1, THEME.accent);
    ctx.fillStyle = g; rr(150, 1600, Math.max(16, 780 * p), 16, 8); ctx.fill();
    text((N - left) + " / " + N, 150, 1575, 28, "800", THEME.ink, "left");
    text(Math.round(p * 100) + "%", 930, 1575, 28, "800", THEME.ink, "right");
    var label = left === 0 ? "✓ CLEARED" : left + " ARROWS LEFT";
    ctx.font = "800 36px " + FONT; var w = ctx.measureText(label).width + 68;
    ctx.fillStyle = "#ffffff14"; rr(540 - w / 2, 1640, w, 66, 33); ctx.fill();
    ctx.strokeStyle = THEME.ink + "44"; ctx.lineWidth = 2; rr(540 - w / 2, 1640, w, 66, 33); ctx.stroke();
    text(label, 540, 1674, 36, "800", THEME.ink);
  }
  function drawCta(big) {
    var t = (now / 900) % 1, pulse = 1 + 0.03 * Math.sin(t * Math.PI * 2);
    var w = ctaBtn.w * pulse, h = ctaBtn.h * pulse, x = ctaBtn.x - w / 2, y = ctaBtn.y - h / 2;
    ctx.shadowColor = "#00000088"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
    ctx.fillStyle = "#fff"; rr(x, y, w, h, h / 2); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.fillStyle = "#14102E"; ctx.beginPath(); ctx.moveTo(x + 62, y + h / 2 - 22); ctx.lineTo(x + 62, y + h / 2 + 22); ctx.lineTo(x + 100, y + h / 2); ctx.closePath(); ctx.fill();
    text("Free on Google Play", x + w / 2 + 24, y + h / 2 + 2, 46, "800", "#14102E");
    if (big) text("Play 100+ pictures. No timer, no pressure.", 540, 1690, 34, "600", THEME.ink);
  }
  function drawPops() {
    for (var k = pops.length - 1; k >= 0; k--) {
      var p = pops[k], u = (now - p.t0) / 700; if (u >= 1) { pops.splice(k, 1); continue; }
      ctx.globalAlpha = 1 - u * u; var y = p.y - 70 * easeOut(u) - 20;
      text(p.text, p.x - 14, y, 34, "900", THEME.accent); drawFeather(p.x + 28, y, 30, THEME.accent); ctx.globalAlpha = 1;
    }
    for (var r = ripples.length - 1; r >= 0; r--) {
      var q = ripples[r], v = (now - q.t0) / 450; if (v >= 1) { ripples.splice(r, 1); continue; }
      ctx.strokeStyle = q.color; ctx.lineWidth = 5; ctx.globalAlpha = (1 - v) * 0.9; ctx.beginPath(); ctx.arc(q.x, q.y, 10 + 70 * v, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
  function drawConfetti() {
    for (var k = confetti.length - 1; k >= 0; k--) {
      var c = confetti[k], u = (now - c.t0) / 1000;
      c.x += c.vx * 0.5; c.y += c.vy * 0.5; c.vy += 0.9; c.rot += 0.12;
      if (c.y > 2000 || u > 2.5) { confetti.splice(k, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.c; ctx.globalAlpha = Math.max(0, 1 - u / 2.5); ctx.fillRect(-9, -9, 18, 18); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawCleared() {
    var u = Math.min(1, (now - clearedAt) / 700), s = spring(u);
    ctx.save(); ctx.translate(540, 820); ctx.scale(s, s); ctx.rotate(-0.08);
    ctx.font = "900 150px " + FONT; var w = ctx.measureText("CLEARED").width + 120;
    ctx.fillStyle = "#00000044"; rr(-w / 2, -105, w, 210, 30); ctx.fill();
    ctx.strokeStyle = THEME.accent; ctx.lineWidth = 10; rr(-w / 2, -105, w, 210, 30); ctx.stroke();
    ctx.shadowColor = THEME.accent; ctx.shadowBlur = 40; text("CLEARED", 0, 6, 150, "900", THEME.accent); ctx.shadowBlur = 0;
    ctx.restore();
    if (now - clearedAt > 500) {
      var v = Math.min(1, (now - clearedAt - 500) / 500);
      ctx.globalAlpha = v;
      text("Every arrow set free.", 540, 1000, 56, "700", "#fff");
      text("Hundreds more pictures are waiting.", 540, 1080, 40, "600", THEME.ink);
      if (icon.complete && icon.naturalWidth) { ctx.save(); ctx.shadowColor = "#00000088"; ctx.shadowBlur = 50; rr(540 - 130, 1180, 260, 260, 60); ctx.clip(); ctx.drawImage(icon, 410, 1180, 260, 260); ctx.restore(); }
      text("Arrow Puzzle", 540, 1510, 84, "900", "#fff");
      ctx.globalAlpha = 1;
    }
  }
  function frame(t) {
    now = t;
    // Automatisches Abräumen: Reihenfolge der Lösung, beschleunigend.
    if (phase === "play" && now - start > AUTO_AFTER_MS) startAuto();
    if (phase === "auto" && now >= autoNext) {
      var next = autoQueue.shift();
      while (next !== undefined && removed[next]) next = autoQueue.shift();
      if (next !== undefined) { fly(next, false); var leftN = autoQueue.length; autoNext = now + Math.max(45, 220 - (N - leftN) * 1.6); }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(offX, offY); ctx.scale(scale, scale);
    drawBackdrop(t);
    if (phase === "cleared" && now - clearedAt > 900) {
      drawConfetti(); drawCleared(); drawCta(true);
    } else {
      drawHeader(); drawBoard(); drawPops(); drawHint(); drawCounterAndProgress(); drawCta(false);
      if (phase === "cleared") drawConfetti();
      if (phase === "auto") { ctx.fillStyle = "#000000aa"; rr(190, 330, 700, 90, 28); ctx.fill(); text("Nice! Watch the rest fly…", 540, 376, 38, "700", "#fff"); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  host({ type: "wm:ready", motif: MOTIF, arrows: N });

  /* MRAID: erst zeichnen, wenn die Anzeige sichtbar ist (optional). */
  try { if (window.mraid && window.mraid.getState && window.mraid.getState() === "loading") window.mraid.addEventListener("ready", resize); } catch (e) {}
})();
</script>
