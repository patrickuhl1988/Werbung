*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none}body{background:#FAFAF9;color:#202725;font-family:Nunito,system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:3px solid #527E58;outline-offset:3px}button:disabled{opacity:.38;cursor:default}button:active:not(:disabled){transform:scale(.96)}
main{position:relative;height:100%;height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column;padding:14px 18px 12px;gap:10px;overflow:auto}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}.brand{display:flex;align-items:center;gap:9px}.logo{width:36px;height:36px;background:#EDF2E9;border-radius:12px;padding:5px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6F7974}h1{margin:0;font:800 28px/1.1 system-ui,sans-serif;letter-spacing:-1px}.sound{height:38px;width:42px;background:#F0F0EE;border-radius:15px;font-size:19px}.sound svg,.actions svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.layout{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}.intro{display:flex;justify-content:space-between;gap:12px;align-items:center}.intro p{font-size:13px;margin:0;color:#616B74}.badge{flex:none;padding:7px 11px;border:1px solid #E3E2DE;border-radius:18px;background:#F1F0ED;font-size:12px}.board-area{min-height:0;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px}.tray{padding:9px;background:white;border:1px solid #EAEAE6;border-radius:24px;box-shadow:0 8px 28px #1e241e14;width:min(100%,420px,calc(100dvh - 365px));min-width:180px;aspect-ratio:1}.board{width:100%;height:100%;display:grid;overflow:hidden;border-radius:15px;touch-action:none}.cell{position:relative;border-radius:0;padding:6%;display:grid;place-items:center;min-height:0;min-width:0;background:var(--color);transition:filter .12s}.cell svg{width:88%;height:88%;pointer-events:none;filter:drop-shadow(0 2px 1px #0002)}.cell:disabled{opacity:1}.cell .mark{font:400 clamp(19px,6vw,32px)/1 system-ui;color:#263D39;pointer-events:none}.cell .auto{opacity:.38}.cell.placed svg{animation:pop .24s ease-out}.cell.hint:after{content:'';position:absolute;inset:4px;border:3px dashed #22382D;border-radius:6px;pointer-events:none}.meter{display:flex;align-items:center;gap:4px;width:min(100%,400px);height:28px}.meter svg{height:23px;width:23px}.meter span{margin-left:auto;color:#616B74;font-size:13px}
.side{display:flex;flex-direction:column;gap:8px}.status{margin:0;min-height:36px;text-align:center;font-size:13px;color:#616B74;display:grid;place-items:center}.actions{display:flex;gap:8px}.actions button{flex:1;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;background:#F1F1EF;border-radius:19px;min-height:56px;font-size:11px}.actions #hint{background:#FFF3C9}.options{display:flex;align-items:center;justify-content:space-between;gap:8px}.auto-toggle{display:flex;align-items:center;gap:7px;background:white;border:1px solid #DDDFDB;border-radius:24px;padding:8px 10px;font-size:11px}.switch{width:27px;height:17px;border-radius:10px;background:#BAC0BC;padding:3px}.switch:after{content:'';display:block;width:11px;height:11px;background:white;border-radius:50%}[aria-checked=true] .switch{background:#62965B}[aria-checked=true] .switch:after{margin-left:auto}.gesture{font-size:11px;color:#69746E;text-align:right}.cta{width:100%;min-height:46px;background:#527E58;color:white;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:15px;font-size:15px;box-shadow:0 4px 12px #527e5820}.cta b{font-size:22px}.next{min-height:42px;background:#EDF2E9;border:1px solid #D9E4D5;border-radius:16px;color:#345B3C}.next[hidden]{display:none}.footer{flex:none}.footer small{display:block;text-align:center;font-size:9px;color:#7B857F;margin-top:5px;letter-spacing:.5px}.celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden}.celebration i{position:absolute;left:var(--x);top:-10px;width:7px;height:13px;background:var(--c);animation:fall 1.6s var(--d) ease-in forwards}.won .tray{box-shadow:0 0 0 3px #A9CFA4,0 12px 32px #527e5829}.won .status{color:#345B3C;font-size:16px}
