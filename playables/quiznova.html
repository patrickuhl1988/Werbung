<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="ad.size" content="width=320,height=480"><title>QuizNova – playable ad</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1024;overflow:hidden}
body{font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;color:#f5f5ff;user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;background:radial-gradient(120% 70% at 10% 0%,#47347d 0%,transparent 60%),radial-gradient(90% 60% at 100% 100%,#134643 0%,transparent 65%),#0b1024}
#stars{position:fixed;inset:0;pointer-events:none}
main{position:relative;height:100%;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));gap:10px;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px}
header img{width:38px;height:38px;border-radius:10px;box-shadow:0 6px 16px #0007}
.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand b{color:#a998ff}
.tag{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:1.6px;color:#b9b6d2;border:1px solid #ffffff26;border-radius:20px;padding:5px 9px}
#hud{display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:6px;flex:1}
.dot{height:6px;flex:1;border-radius:4px;background:#ffffff1c;overflow:hidden}
.dot.done{background:#3ee08f}.dot.miss{background:#ff6b7a}.dot.now{background:linear-gradient(90deg,#a998ff,#58f4dc)}
#score{font-weight:800;font-size:18px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
#score small{font-size:11px;color:#b9b6d2;font-weight:600;letter-spacing:1px;margin-right:4px}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.card{border-radius:22px;overflow:hidden;background:#151a33;border:1px solid #a998ff3a;box-shadow:0 18px 40px #0009;display:flex;flex-direction:column;min-height:0}
.pic{position:relative;flex:none;width:100%;aspect-ratio:5/3;max-height:36vh;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 6s linear}
.pic.live img{transform:scale(1)}
.chip{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;letter-spacing:.6px;padding:5px 10px;border-radius:14px;background:#0b1024cc;backdrop-filter:blur(4px)}
.q{padding:12px 14px 14px;font-size:clamp(16px,4.6vw,21px);font-weight:700;line-height:1.25;letter-spacing:-.2px}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ans{position:relative;min-height:58px;border-radius:16px;border:1.5px solid #ffffff2c;background:#ffffff12;color:#fff;font:inherit;font-size:clamp(14px,4vw,17px);font-weight:700;padding:10px 12px;display:flex;align-items:center;gap:9px;text-align:left;transition:transform .12s,background .2s,border-color .2s,opacity .2s}
.ans:active{transform:scale(.97)}
.ans i{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;opacity:.85}
.ans.ok{background:linear-gradient(135deg,#3ee08f,#17a864);border-color:#b7ffd8;color:#03200f;animation:pop .35s}
.ans.bad{background:linear-gradient(135deg,#ff6b7a,#c9364a);border-color:#ffc0c8;animation:shake .35s}
.ans.dim{opacity:.38}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fact{min-height:0;font-size:13px;line-height:1.35;color:#d6d4ea;background:#ffffff10;border-radius:14px;padding:9px 12px;opacity:0;transform:translateY(8px);transition:.25s}
#fact.on{opacity:1;transform:none}
#fact b{color:#58f4dc}
footer{display:flex;flex-direction:column;gap:6px}
#cta,#endCtaBtn{border:0;border-radius:18px;min-height:54px;background:linear-gradient(110deg,#8565e8,#6443cc);color:#fff;font:inherit;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 30px #6443cc66;animation:breathe 2.4s ease-in-out infinite}
#cta svg,#endCtaBtn svg{width:18px;height:18px;fill:currentColor}
@keyframes breathe{50%{transform:scale(1.03)}}
#foot{text-align:center;font-size:11px;color:#9a96b8}
#hand{position:fixed;width:54px;height:54px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;filter:drop-shadow(0 6px 10px #0009)}
#hand.on{opacity:1;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{50%{transform:translate(6px,8px) scale(.9)}}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-weight:900;font-size:44px;color:#ffd178;text-shadow:0 6px 24px #000a;opacity:0;pointer-events:none;z-index:6}
#toast.on{animation:toast .9s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#0b1024f2;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:7}
#end.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.endbox{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.endbox img{width:84px;height:84px;border-radius:22px;box-shadow:0 12px 30px #0009}
#endScore{font-size:64px;font-weight:900;letter-spacing:-3px;background:linear-gradient(90deg,#ffd178,#58f4dc);-webkit-background-clip:text;background-clip:text;color:transparent}
#endTitle{font-size:24px;font-weight:800}
#endSub{font-size:14px;color:#c9c6e4;line-height:1.4}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pills span{font-size:12px;font-weight:700;padding:6px 10px;border-radius:14px;background:#ffffff14;border:1px solid #ffffff22}
#again{background:none;border:0;color:#b9b6d2;font:inherit;font-size:14px;text-decoration:underline;padding:6px}
#endCtaBtn{width:100%;padding:0 18px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
#sound{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid #ffffff2a;background:#ffffff12;color:#fff;font-size:14px;display:none;align-items:center;justify-content:center}
@media (orientation:landscape) and (max-height:520px){
 main{max-width:none;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:14px}
 header{grid-column:1;grid-row:1}
 header .tag{margin-left:12px}
 #stage{grid-column:1/3;grid-row:2;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start}
 #hud{grid-column:2;grid-row:1;align-self:center}
 .pic{max-height:none;aspect-ratio:auto;height:42vh}
 .q{font-size:16px;padding:8px 12px 10px}
 .ans{min-height:46px;font-size:14px}
 footer{grid-column:1/3;grid-row:3;flex-direction:row;align-items:center}
 #cta{flex:1;min-height:44px;font-size:16px}
 #foot{flex:none}
}
</style></head>

<main>
 <header><img id="logo" alt=""><div class="brand">Quiz<b>Nova</b></div><div class="tag" id="tag"></div><button id="sound" aria-label="sound">🔊</button></header>

$('tag').textContent=T.tag;$('ptsLabel').textContent=T.points;$('ctaLabel').textContent=T.cta;$('foot').textContent=T.foot;
$('endCtaBtn').innerHTML=$('cta').innerHTML;
$('again').textContent=T.again;
T.pills.forEach(p=>{const s=document.createElement('span');s.textContent=p;$('pills').appendChild(s);});

/* ---------- background stars ---------- */
const st=$('stars'),sx=st.getContext('2d');let W=0,H=0;const dotsBg=Array.from({length:46},(_,i)=>({x:Math.random(),y:Math.random(),r:i%7?1:2,v:.00004+Math.random()*.00008}));
function size(){const d=devicePixelRatio||1;for(const c of [st,$('fx')]){c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';c.getContext('2d').setTransform(d,0,0,d,0,0);}W=innerWidth;H=innerHeight;}
addEventListener('resize',size);size();

/* ---------- confetti ---------- */
const fx=$('fx'),fc=fx.getContext('2d');let parts=[];
function burst(x,y,n=46){const cols=['#58f4dc','#a998ff','#ffd178','#ff7ab6'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:Math.random()*6,w:5+Math.random()*5,h:8+Math.random()*6,c:cols[i%4],l:60+Math.random()*30});}}
function frame(){if(!paused){sx.clearRect(0,0,W,H);for(const d of dotsBg){d.y=(d.y+d.v*16)%1;sx.fillStyle='rgba(255,255,255,.45)';sx.beginPath();sx.arc(d.x*W,d.y*H,d.r,0,7);sx.fill();}
fc.clearRect(0,0,W,H);parts=parts.filter(p=>p.l-->0);for(const p of parts){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.15;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.globalAlpha=Math.min(1,p.l/25);fc.fillStyle=p.c;fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore();}}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------- game ---------- */
const PER_ROUND=3;let round=0,qi=0,score=0,right=0,locked=false,idleT=null,autoT=null,nextT=null,shownCleared=false;
function roundQuestions(){const all=DATA.questions;const start=(round*PER_ROUND)%all.length;return Array.from({length:PER_ROUND},(_,i)=>all[(start+i)%all.length]);}
let list=roundQuestions();
function dots(){const d=$('dots');d.innerHTML='';list.forEach((q,i)=>{const e=document.createElement('div');e.className='dot'+(i<qi?(q._ok?' done':' miss'):i===qi?' now':'');d.appendChild(e);});}
function clearTimers(){clearTimeout(idleT);clearTimeout(autoT);clearTimeout(nextT);$('hand').classList.remove('on');}
function armIdle(){clearTimers();if(paused)return;idleT=setTimeout(showHand,4500);autoT=setTimeout(()=>{if(!locked)answer(list[qi].correct,true);},9000);}
function showHand(){const b=$('answers').children[list[qi].correct];if(!b||locked)return;const r=b.getBoundingClientRect();const h=$('hand');h.style.left=(r.left+r.width*.62)+'px';h.style.top=(r.top+r.height*.35)+'px';h.classList.add('on');}
function show(){locked=false;const q=list[qi],t=q.t[L]||q.t.en;$('pic').classList.remove('live');$('img').src=q.img;$('chip').textContent=t.cat;$('q').textContent=t.q;
 requestAnimationFrame(()=>requestAnimationFrame(()=>$('pic').classList.add('live')));
 const box=$('answers');box.innerHTML='';t.a.forEach((a,i)=>{const b=document.createElement('button');b.className='ans';b.innerHTML='<i>'+'ABCD'[i]+'</i><span></span>';b.lastChild.textContent=a;b.onclick=()=>{audioOk=true;$('sound').style.display='flex';answer(i,false);};box.appendChild(b);});
 $('fact').classList.remove('on');dots();armIdle();}
function bump(to){const from=+$('pts').textContent;const t0=performance.now();const step=n=>{const k=Math.min(1,(n-t0)/500);$('pts').textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);setTimeout(()=>{$('pts').textContent=to;},560);}
function answer(i,auto){if(locked)return;locked=true;clearTimers();const q=list[qi],t=q.t[L]||q.t.en,btns=[...$('answers').children];const ok=i===q.correct;q._ok=ok;
 btns.forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('ok');else if(k===i)b.classList.add('bad');else b.classList.add('dim');});
 if(ok){right++;score+=100+(right>1?50*(right-1):0);bump(score);sfx(right>1?'streak':'correct');const r=btns[i].getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);const toast=$('toast');toast.textContent=right>1?T.streak.replace('{n}',right):'+100';toast.classList.remove('on');void toast.offsetWidth;toast.classList.add('on');}
 else sfx('wrong');
 $('fact').innerHTML='<b>'+(ok?T.right:T.wrong)+'</b> ';$('fact').appendChild(document.createTextNode(t.fact));$('fact').classList.add('on');
 nextT=setTimeout(advance,auto?2600:2300);}
function advance(){qi++;if(qi<list.length)show();else finish();}
// After a pause: continue where the round stood (also mid-feedback, which would otherwise stall).
function resume(){if($('end').classList.contains('on'))return;if(locked)nextT=setTimeout(advance,1200);else armIdle();}
function finish(){dots();$('endScore').textContent=right+' / '+list.length;$('endTitle').textContent=right===list.length?T.perfect:right>0?T.good:T.try;$('endSub').textContent=T.endSub;$('end').classList.add('on');sfx('streak');burst(W/2,H*.3,80);
 if(!shownCleared){shownCleared=true;host({type:'wm:cleared',game:'quiznova',correct:right,total:list.length});}}
$('again').onclick=()=>{$('end').classList.remove('on');round++;list=roundQuestions();list.forEach(q=>delete q._ok);qi=0;right=0;show();};
function cta(){stopAll();const url=STORE;if(host({type:'wm:cta',url}))return;if(window.mraid&&window.mraid.open){window.mraid.open(url);return;}if(window.FbPlayableAd&&window.FbPlayableAd.onCTAClick){window.FbPlayableAd.onCTAClick();return;}if(window.dapi&&window.dapi.openStoreUrl){window.dapi.openStoreUrl();return;}window.open(url,'_blank','noopener');}
$('cta').onclick=cta;$('endCtaBtn').onclick=cta;

/* ---------- messages from the host ---------- */
addEventListener('message',e=>{let m=e.data;if(typeof m==='string'){try{m=JSON.parse(m);}catch(x){return;}}if(!m||typeof m!=='object')return;
 if(m.type==='wm:mute'){muted=!!m.muted;if(muted)stopAll();$('sound').textContent=muted?'🔇':'🔊';}
 if(m.type==='wm:pause'){paused=true;clearTimers();stopAll();}
 if(m.type==='wm:resume'){if(paused){paused=false;resume();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;clearTimers();stopAll();}else if(paused){paused=false;resume();}});

show();
// wm:ready exactly once: after the first painted frame, at the latest after 300 ms
let readySent=false;const ready=()=>{if(readySent)return;readySent=true;host({type:'wm:ready',game:'quiznova'});};
requestAnimationFrame(()=>requestAnimationFrame(ready));setTimeout(ready,300);
})();
</script></body></html>
