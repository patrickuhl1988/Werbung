*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overscroll-behavior:none}
/* Farben aus assets/style/palette.svg (ArtPalette) */
body{background:#171d26;color:#f5ebdd;font-family:Nunito,system-ui,sans-serif;font-weight:650;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
button:focus-visible{outline:3px solid #ffb547;outline-offset:2px}
button:active:not(:disabled){transform:scale(.96)}
main{position:relative;height:100%;height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column;padding:10px 12px 10px;gap:8px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:42px;height:42px;border-radius:11px;flex:none;background:center/cover}
.head{flex:1;min-width:0}
.over{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#cc8658;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{margin:0;font-size:19px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;flex:none;border-radius:14px;background:#303d4b;border:1px solid #647487;display:grid;place-items:center}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;border-radius:18px;background:radial-gradient(ellipse at 50% 35%,#cc865833,#171d26 72%)}
.room{position:relative;width:200px;height:256px}
.room canvas{display:block;width:100%;height:100%;border-radius:6px;box-shadow:0 18px 40px #000a,0 0 0 1px #ffffff14;touch-action:none}
.dock{flex:none;display:flex;flex-direction:column;gap:8px}
.msg{min-height:54px;background:#222c38;border:1px solid #64748740;border-radius:12px;padding:8px 12px;display:flex;align-items:center;font-size:14px;line-height:1.3}
.msg span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg.note{border-color:#ffb54780}
.inv{min-height:62px;background:#222c38;border:1px solid #64748740;border-radius:16px;padding:4px 6px;display:flex;gap:6px;align-items:center;overflow-x:auto}
.inv .empty{flex:1;text-align:center;font-size:12px;color:#b7c3cf;line-height:1.35;white-space:pre-line}
.slot{width:54px;height:54px;flex:none;border-radius:12px;background:#303d4b;border:1px solid #647487;display:grid;place-items:center;touch-action:none}
.slot img{width:40px;height:40px;pointer-events:none}
.slot.on{border:2px solid #ffb547;background:#ffb54733}
.ghost{position:fixed;width:56px;height:56px;pointer-events:none;z-index:9;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 6px 10px #000a)}
.nextb{width:100%;min-height:44px;border-radius:14px;background:#303d4b;border:1px solid #ffb547;color:#ffb547;font-weight:900}
.nextb[hidden]{display:none}
.cta{flex:none;width:100%;min-height:48px;background:#ffb547;color:#171d26;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:900;box-shadow:0 6px 18px #ffb54733}
.cta b{font-size:20px}
.done .cta{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035);box-shadow:0 6px 26px #ffb54780}}
small.ad{display:block;text-align:center;font-size:9px;color:#b7c3cf;letter-spacing:.5px;opacity:.75;margin-top:-3px}
/* Ergebnis-Karte wie floor_view.gd (_result_panel) */
.result{position:absolute;inset:0;display:grid;place-items:center;background:#0b111699;z-index:5;padding:14px}
.result[hidden]{display:none}
.card{width:min(100%,360px);background:#222c38;border:1px solid #647487;border-radius:20px;padding:16px;text-align:center;box-shadow:0 20px 50px #000c;animation:card .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes card{from{transform:scale(.8);opacity:0}}
.card .ov{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#ffb547}
.card h2{margin:4px 0 8px;font-size:24px;font-weight:900}
.stars{display:flex;justify-content:center;gap:18px;margin:4px 0 10px}
.stars svg{width:46px;height:46px}
.card p{margin:0 0 12px;color:#b7c3cf;font-size:13px;line-height:1.4}
.card .row{display:flex;gap:8px}
.card button{flex:1;min-height:44px;border-radius:14px;background:#303d4b;border:1px solid #647487;font-weight:800}
.card button.pri{background:#ffb547;color:#171d26;border:0;width:100%;margin-bottom:8px}
.sheet{position:absolute;inset:0;background:#0b1116cc;z-index:6;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{width:100%;max-width:520px;max-height:80%;overflow:auto;background:#222c38;border:1px solid #647487;border-radius:20px 20px 0 0;padding:16px}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:900}
.sheet li{margin:0 0 8px;font-size:14px;line-height:1.35;color:#f5ebdd}
.sheet ul{padding-left:18px;margin:0 0 12px}
.sheet button{width:100%;min-height:44px;border-radius:14px;background:#303d4b;border:1px solid #647487;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.confetti i{position:absolute;left:var(--x);top:-10px;width:7px;height:13px;background:var(--c);animation:fall 1.6s var(--d) ease-in forwards}
@keyframes fall{to{transform:translateY(100dvh) rotate(500deg);opacity:0}}
@media(orientation:landscape) and (min-width:560px){
main{display:grid;grid-template-columns:min(55vw,calc((100dvh - 16px) * 0.7826)) minmax(220px,1fr);grid-template-rows:auto 1fr auto;column-gap:16px;padding:8px 16px}
header{grid-column:2;grid-row:1}
.play{display:contents}
.stage{grid-column:1;grid-row:1/4;background:none}
.dock{grid-column:2;grid-row:2;justify-content:flex-end}
.foot{grid-column:2;grid-row:3}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>

<div class="play"><div class="stage"><div class="room"><canvas id="cv" width="540" height="690"></canvas>
<div id="result" class="result" hidden><div class="card"><div id="r-over" class="ov"></div><h2 id="r-title"></h2><div id="r-stars" class="stars"></div><p id="r-text"></p><button id="r-main" class="pri"></button><div class="row"><button id="r-look"></button></div></div></div>
<div id="sheet" class="sheet" hidden><div class="in"><h3 id="s-title"></h3><ul id="s-list"></ul><button id="s-close"></button></div></div></div></div>
<div class="dock"><div id="msg" class="msg" role="status" aria-live="polite"><span></span></div><div id="inv" class="inv"></div><button id="next" class="nextb" hidden></button></div></div>

</main><div id="confetti" class="confetti" aria-hidden="true"></div>

"], ["Lampe 1 und 3 müssen an, 2 und 4 bleiben an. Nimm zwei Schalter, die dieselbe brennende Lampe betreffen: Dort hebt sich ihre Wirkung auf.", "Lamps 1 and 3 must turn on, 2 and 4 must stay on. Use two switches that share a lit lamp: their effects cancel out there."]], [["Pflanzen stehen manchmal auf mehr als nur Erde. Versuch, den Topf zur Seite zu ziehen.", "Plants sometimes stand on more than soil. Try dragging the pot aside."], ["Die Lampe aus der Schublade ist keine normale Lampe. Tippe sie im Inventar an und leuchte die Tierfiguren an.", "The torch from the drawer is no ordinary torch. Tap it in the inventory and shine it at the animal figures."], ["Das Foto bestimmt die Reihenfolge: von oben nach unten. Eule, Katze, Fisch.", "The photo sets the order: top to bottom. Owl, cat, fish."]]]};

  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;

  /* ---------- Brücke zur App (wie Königinnen, Sort Rush, Mühle) ---------- */
  function send(m) {
    try {
      if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(JSON.stringify(m)); return true; }
      if (parent !== window) { parent.postMessage(m, "*"); return true; }
    } catch (e) {}
    return false;
  }

  /* ---------- Klänge: dieselben Formeln wie scripts/sfx.gd (synthetisiert, 22 050 Hz) ---------- */
  var RATE = 22050, MATERIALS = ["wood", "metal", "glass", "paper", "plastic", "stone", "plant", "fabric"];
  function env(t, a, d) { return t < a ? t / a : Math.exp(-(t - a) / d); }
  function noise() { return Math.random() * 2 - 1; }
  var sn = Math.sin, sgn = Math.sign;
  var SYNTH = {
    wood: [0.14, function (t) { return env(t, 0.002, 0.05) * (sn(TAU * 170 * t) * 0.7 + noise() * 0.25); }],
    metal: [0.45, function (t) { return env(t, 0.001, 0.14) * (sn(TAU * 523 * t) * 0.4 + sn(TAU * 1317 * t) * 0.3 + sn(TAU * 2151 * t) * 0.2); }],
    glass: [0.5, function (t) { return env(t, 0.001, 0.16) * (sn(TAU * 1760 * t) * 0.35 + sn(TAU * 2963 * t) * 0.25); }],
    paper: [0.16, function (t) { return env(t, 0.01, 0.05) * noise() * 0.35; }],
    plastic: [0.07, function (t) { return env(t, 0.0005, 0.015) * (sn(TAU * 900 * t) * 0.5 + noise() * 0.3); }],
    stone: [0.18, function (t) { return env(t, 0.001, 0.04) * (sn(TAU * 95 * t) * 0.6 + noise() * 0.35); }],
    plant: [0.25, function (t) { return env(t, 0.02, 0.07) * noise() * 0.25 * (0.6 + 0.4 * sn(TAU * 31 * t)); }],
    fabric: [0.12, function (t) { return env(t, 0.01, 0.04) * noise() * 0.18; }],
    empty: [0.09, function (t) { return env(t, 0.001, 0.02) * sn(TAU * 420 * t) * 0.18; }],
    discover: [0.7, function (t) { return env(t, 0.005, 0.25) * sn(TAU * [660, 880, 1320][Math.min(2, Math.floor(t / 0.12))] * t) * 0.45; }],
    wrong: [0.28, function (t) { return env(t, 0.002, 0.12) * sgn(sn(TAU * 110 * t)) * 0.25; }],
    partial: [0.25, function (t) { return env(t, 0.001, 0.06) * (sn(TAU * 140 * t) * 0.7 + noise() * 0.15); }],
    pickup: [0.28, function (t) { return env(t, 0.003, 0.1) * sn(TAU * (500 + 1400 * t) * t) * 0.4; }],
    bounce: [0.25, function (t) { return env(t, 0.002, 0.09) * sn(TAU * (380 - 500 * t) * t) * 0.45; }],
    "switch": [0.12, function (t) { return env(t, 0.0005, 0.02) * (noise() * 0.5 + sn(TAU * 220 * t) * 0.5); }],
    key: [0.06, function (t) { return env(t, 0.0005, 0.02) * sn(TAU * 1250 * t) * 0.3; }],
    dial: [0.05, function (t) { return env(t, 0.0002, 0.008) * (noise() * 0.6 + sn(TAU * 2400 * t) * 0.3); }],
    hum: [0.8, function (t) { return env(t, 0.05, 0.4) * (sn(TAU * 100 * t) * 0.15 + sn(TAU * 200 * t) * 0.08 + noise() * 0.03); }],
    fuse: [0.6, function (t) { return env(t, 0.0005, 0.12) * noise() * 0.9; }],
    relay: [0.1, function (t) { return env(t, 0.0005, 0.015) * (noise() * 0.4 + sn(TAU * 1600 * t) * 0.4); }],
    door: [0.9, function (t) { return env(t, 0.05, 0.4) * (sn(TAU * (90 + 40 * sn(TAU * 3 * t)) * t) * 0.4 + noise() * 0.08); }],
    gong: [1.4, function (t) { return env(t, 0.002, 0.5) * (sn(TAU * (t < 0.45 ? 784 : 659) * t) * 0.4 + sn(TAU * (t < 0.45 ? 1568 : 1318) * t) * 0.1); }],

    notes.forEach(function (n) { var li = document.createElement("li"); li.textContent = n.text; list.appendChild(li); });
    $("s-title").textContent = L("Logbuch · Etage ", "Logbook · Floor ") + (level + 1);
    $("s-close").textContent = L("Schließen", "Close");
    $("sheet").hidden = false;
  }
  $("s-close").onclick = function () { $("sheet").hidden = true; };
  $("hint").onclick = function () {
    wake(); play("plastic", -6);
    var h = DATA.hints[level];
    message(L("Hinweis ", "Hint ") + (hintNr + 1) + "/3: " + L(h[hintNr]), true);
    hintNr = (hintNr + 1) % 3;
  };

  /* ---------- Eingabe im Raum ---------- */
  function roomPoint(e) {
    var b = cv.getBoundingClientRect();
    if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) return null;
    return [(e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H];
  }
  var down = null;
  function capture(e) { try { cv.setPointerCapture(e.pointerId); } catch (x) {} }
  cv.addEventListener("pointerdown", function (e) {
    wake(); e.preventDefault();
    var p = roomPoint(e);
    if (!p || cardOpen) return;
    room.idle = 0; room.hotsShown = false;
    if (room.detail) {
      var inClose = p[0] >= W - 74 && p[0] <= W - 14 && p[1] >= 8 && p[1] <= 68;
      var inPanel = p[0] >= 20 && p[0] <= W - 20 && p[1] >= 60 && p[1] <= H - 60;
      if (inClose || !inPanel) { material("plastic"); room.closeDetail(); }
      return;
    }
    if (room.uv) {
      var uh = hitAt(p[0], p[1]);
      if (uh && uh.o === room.uvOff) { down = { h: uh, t0: now(), start: p, last: p, drag: false, long: false }; capture(e); return; }
      down = { uv: true }; room.shine(p); capture(e); return;
    }
    var h = hitAt(p[0], p[1]);
    if (selected && h && !room.done) { var it = selected; selected = null; drawInventory(); room.taps++; room.dropItem(it, h.o); return; }
    if (!h) { room.fx.push({ k: "ripple", x: p[0], y: p[1], t: 0 }); play("empty", -10); return; }
    down = { h: h, t0: now(), start: p, last: p, drag: false, long: false };
    capture(e);
    // Langes Drücken (Hot.LONG_PRESS = 0,5 s) per Timer, unabhängig vom Bildaufbau
    var mine = down;
    setTimeout(function () { if (down === mine && !mine.drag && !mine.long) { mine.long = true; buzz(25); if (mine.h.o.onLong) mine.h.o.onLong(); } }, 500);
  });
  cv.addEventListener("pointermove", function (e) {
    if (!down) return;
    var b = cv.getBoundingClientRect(), p = [(e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H];
    if (down.uv) { room.shine(p); return; }
    var total = [p[0] - down.start[0], p[1] - down.start[1]], rel = [p[0] - down.last[0], p[1] - down.last[1]];
    down.last = p;
    if (!down.drag && !down.long && Math.hypot(total[0], total[1]) > 14) { down.drag = true; if (down.h.o.onDragStart) down.h.o.onDragStart(); }
    if (down.drag && down.h.o.onDrag) down.h.o.onDrag(rel, total, down.h.lx + total[0], down.h.ly + total[1]);
  });
  function up() {
    if (!down) return;
    var d = down; down = null;
    if (d.uv) return;
    var o = d.h.o, total = [d.last[0] - d.start[0], d.last[1] - d.start[1]];
    room.taps++;
    if (d.drag) { if (o.onDragEnd) o.onDragEnd(total); return; }
    if (d.long) return;
    if (o.bounce) spring(o);
    if (o.mat) material(o.mat);
    if (o.onTap) o.onTap(d.h.lx, d.h.ly);
  }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", function () { down = null; });

  /* ---------- Bildlauf ---------- */
  function frame() {
    var t = now(), dt = Math.min(1, t - last); last = t;
    stepTweens(dt);
    if (room) {
      if (room.process) room.process(dt);
      room.idle += dt;
      if (room.idle > 15 && !room.hotsShown && !room.done && !room.detail && !cardOpen) { room.hotsShown = true; showHots(); }
      render(dt);
    }
    requestAnimationFrame(frame);
  }
  function showHots() {
    room.layers.forEach(function (o) {
      if (o.kind !== "hot" || !shown(o) || o.w < 24 || o.id === "golden" || o.id === "uv_off") return;
      var or = origin(o);
      room.fx.push({ k: "hot", x: or[0] + o.x + o.dx + o.w / 2, y: or[1] + o.y + o.dy + o.h / 2, r: clamp(Math.min(o.w, o.h) * 0.45, 18, 60), t: 0 });
    });
  }
  function render(dt) {
    var dpr = Math.min(3, window.devicePixelRatio || 1), cw = Math.round(cv.clientWidth * dpr), ch = Math.round(cv.clientHeight * dpr);
    if (cw && (cv.width !== cw || cv.height !== ch)) { cv.width = cw; cv.height = ch; }
    g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    g.clearRect(0, 0, W, H);
    room.layers.forEach(drawLayer);
    if (room.uv && room.drawUv) room.drawUv();
    if (room.detail) {
      var d = room.detail; d.t = now() - d.at;
      rect(0, 0, W, H, [0, 0, 0, 0.78]);
      var p = Math.min(1, d.t / 0.22), s = 0.6 + 0.4 * EASE.backOut(p);
      g.save(); g.globalAlpha = Math.min(1, d.t / 0.15);
      g.translate(270, 345); g.scale(s, s); g.translate(-250, -285);
      d.draw(500, 570);
      g.restore();
      circle(W - 44, 38, 24, [1, 1, 1, 0.12]);
      line(W - 54, 28, W - 34, 48, "f5ebdd", 3); line(W - 54, 48, W - 34, 28, "f5ebdd", 3);
    }
    // Effekte (FloorRoom._draw_fx): Wellen, Funkeln, Hinweis-Puls, Flug ins Inventar
    room.fx.forEach(function (f) { f.t += dt; });
    room.fx = room.fx.filter(function (f) { return f.t < (f.k === "hot" ? 1.6 : f.k === "fly" ? 0.55 : 0.7); });
    room.fx.forEach(function (f) {
      var k = f.t / 0.7;
      if (f.k === "ripple") arc(f.x, f.y, 8 + 30 * k, 0, TAU, [1, 1, 1, 0.35 * (1 - k)], 2);
      else if (f.k === "hot") { var q = f.t / 1.6, a = Math.sin(q * Math.PI); arc(f.x, f.y, f.r * (0.8 + 0.3 * q), 0, TAU, [1, 0.85, 0.5, 0.55 * a], 2.5); glow(f.x, f.y, f.r, [1, 0.85, 0.5, 0.5 * a], 5); }
      else if (f.k === "sparkle") for (var i = 0; i < 6; i++) { var an = i * TAU / 6 + k * 2; star(f.x + Math.cos(an) * (10 + 40 * k), f.y + Math.sin(an) * (10 + 40 * k), 7 * (1 - k) + 1, [1, 0.9, 0.5, 1 - k]); }
      else if (f.k === "fly") { var fp = EASE.quadIn(f.t / 0.55); icon(f.id, f.x + (W / 2 - f.x) * fp, f.y + (H + 40 - f.y) * fp, 56 * (1 - 0.4 * fp)); }
    });
    // Einblendung beim Betreten: Etagennummer und Titel (FloorView._title_card)
    var tt = now() - room.titleAt;
    if (tt < 1.65) {
      var al = tt < 0.25 ? tt / 0.25 : tt < 1.15 ? 1 : 1 - (tt - 1.15) / 0.5;
      g.save(); g.globalAlpha = al;
      font(30, 900); var tw = Math.max(g.measureText(L(DATA.titles[level])).width, 120) + 44;
      roundedBorder(W / 2 - tw / 2, H * 0.36 - 44, tw, 92, 24, [0.03, 0.05, 0.07, 0.9], [1, 1, 1, 0.08], 1);
      textC((L("Etage ", "Floor ") + (level + 1)).toUpperCase(), W / 2, H * 0.36 - 16, 13, "e0aa8a", 800);
      textC(L(DATA.titles[level]), W / 2, H * 0.36 + 18, 30, "f5ebdd", 900);
      g.restore();
    }
  }

  /* ---------- Ton-Knopf, App-Brücke, Start ---------- */
  function svgIcon(p) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + "</svg>"; }
  function drawSound() {
    var b = $("sound");
    b.setAttribute("aria-pressed", String(soundOn));
    b.setAttribute("aria-label", soundOn ? L("Ton aus", "Sound off") : L("Ton an", "Sound on"));
    b.innerHTML = svgIcon('<path d="M11 4 5 9H2v6h3l6 5Z"/>' + (soundOn ? '<path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>' : '<path d="m16 9 6 6m0-6-6 6"/>'));
  }
  $("sound").onclick = function () { soundOn = !soundOn; stopAll(); drawSound(); if (soundOn) { wake(); play("plastic", -6); } };
  $("hint").innerHTML = svgIcon('<path d="M9 18h6M10 22h4M9 15c0-3-4-3-4-7a7 7 0 0 1 14 0c0 4-4 4-4 7"/>');
  $("hint").setAttribute("aria-label", L("Hinweis", "Hint"));
  document.addEventListener("visibilitychange", function () { if (document.hidden) { stopAll(); if (ctx) ctx.suspend(); } else if (soundOn && !paused && ctx) ctx.resume().catch(function () {}); });
  window.addEventListener("pagehide", stopAll);
  window.addEventListener("message", function (ev) {
    if (ev.source !== parent) return;
    var m = ev.data;
    try { if (typeof m === "string") m = JSON.parse(m); } catch (e) { return; }
    if (!m) return;
    if (m.type === "wm:mute") { soundOn = !m.muted; stopAll(); drawSound(); }
    if (m.type === "wm:pause") { paused = true; stopAll(); if (ctx) ctx.suspend(); }
    if (m.type === "wm:resume") { paused = false; wake(); }
  });
  function openStore() {
    stopAll();
    if (send({ type: "wm:cta", url: STORE })) return;
    var w = window;
    if (w.mraid && w.mraid.open) { w.mraid.open(STORE); return; }
    if (w.FbPlayableAd && w.FbPlayableAd.onCTAClick) { w.FbPlayableAd.onCTAClick(); return; }
    if (w.dapi && w.dapi.openStoreUrl) { w.dapi.openStoreUrl(); return; }
    window.open(STORE, "_blank", "noopener");
  }
  $("cta").onclick = openStore;
  $("cta-label").textContent = L("TOWER 100 kostenlos spielen", "Play TOWER 100 free");
  $("ad").textContent = L("Spielbare Anzeige · JOCULUS", "Playable ad · JOCULUS");
  $("logo").style.backgroundImage = "url(data:image/webp;base64," + DATA.icon + ")";
  $("logo").setAttribute("aria-label", "TOWER 100");
  document.title = "TOWER 100 · " + L("Jetzt spielen", "Play now");
  drawSound();
  load(clamp((+Q.get("floor") || 1) - 1, 0, FLOORS.length - 1));  // floor=2|3 nur zum Prüfen
  var readySent = false;
  function ready() { if (readySent) return; readySent = true; send({ type: "wm:ready", game: "tower100" }); }
  function start() { requestAnimationFrame(frame); requestAnimationFrame(function () { requestAnimationFrame(ready); }); setTimeout(ready, 300); }
  var pending = BACK.concat(Object.keys(ICONS).map(function (k) { return ICONS[k]; })).filter(function (im) { return !im.complete; });
  var fontReady = document.fonts && document.fonts.load ? document.fonts.load("700 20px Nunito") : Promise.resolve();
  Promise.all(pending.map(function (im) { return new Promise(function (ok) { im.onload = im.onerror = ok; }); }).concat([fontReady.catch(function () {})])).then(start);
})();
</script></body></html>
