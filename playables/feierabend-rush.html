<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071B3A"><title>Rushstep · Play now</title>
<style>

body.compact .cta{min-height:48px}body.compact .cta img{width:36px;height:36px}body.compact .cta .t b{font-size:15.5px}body.compact .foot{padding-top:18px}body.compact .ad{margin-top:4px}

<script>/*
 * Rushstep – Spiel-Mathematik der spielbaren Anzeige.
 *
 * Formeln und Konstanten 1:1 aus der App (src/game/engine.ts): Spurversatz,
 * gekachelte Kollision mit Spieler- und Hindernis-Toleranz, Kaffee-Boost,
 * Hupen, Punkte und Sterne. test.cjs vergleicht die Zahlen mit der App.
 *
 * Das Level ist eine Kurzfassung von Level 1 „Der Arbeitsweg“
 * (src/levels/level1.ts): Wohnstraße, Hauptstraße mit Bus, Bahnübergang,
 * Firmengelände – dieselben Spuren, Tempi und Phasen, nur weniger davon.
 * Gespielt wird im Tempo des Modus „Leicht“ (easyFactor 0,78).
 */
(function (root) {
  'use strict';

  var HIT_FORGIVENESS = 0.32;
  var ENTITY_FORGIVENESS = 0.18;
  var COFFEE_BOOST = { seconds: 6, factor: 0.65 };
  var HONK = { near: 2.0, cooldown: 3.0 };
  var SCORE = { perRow: 10, perGoal: 600, perPickup: 25, timeBonusPerSecond: 3, lifeBonus: 200 };

  function mod(a, n) {
    return ((a % n) + n) % n;
  }

  /** Versatz einer Spur zum Zeitpunkt t, in Rasterfeldern (positiv = nach rechts). */
  function laneOffset(lane, t, speedScale) {
    var dir = lane.dir || 1;
    var speed = (lane.speed || 0) * speedScale;
    return dir * speed * (t + (lane.phase || 0));
  }

  function overlapsTiled(entStart, entLen, pattern, aLo, aHi) {
    var p = mod(entStart, pattern);
    for (var k = -1; k <= 1; k++) {
      var lo = p + k * pattern;
      var hi = lo + entLen;
      if (aLo < hi && lo < aHi) return true;
    }
    return false;
  }

  /** Trifft die Spur den Spieler? playerX = linke Kante in Feldern. */
  function laneHitsPlayer(lane, t, playerX, speedScale) {
    var ents = lane.entities;
    if (!ents || !ents.length) return false;
    var pattern = lane.patternCells || 1;
    var off = laneOffset(lane, t, speedScale);
    var aLo = playerX + HIT_FORGIVENESS;
    var aHi = playerX + 1 - HIT_FORGIVENESS;
    for (var i = 0; i < ents.length; i++) {
      var e = ents[i];
      var inset = Math.min(ENTITY_FORGIVENESS, e.len * 0.3);
      if (overlapsTiled(e.at + off + inset, e.len - inset * 2, pattern, aLo, aHi)) return true;
    }
    return false;
  }

  /**
   * Hupt ein Straßenfahrzeug? Wie in der App: wer knapp vor die Haube läuft
   * (Abstand unter HONK.near Feldern, Fahrzeug kommt auf ihn zu), hört es.
   */
  function honkDistance(lane, t, playerX, speedScale) {
    var ents = lane.entities;
    if (!ents || !ents.length) return Infinity;
    var pattern = lane.patternCells || 1;
    var off = laneOffset(lane, t, speedScale);
    var dir = lane.dir || 1;
    var best = Infinity;
    for (var i = 0; i < ents.length; i++) {
      var e = ents[i];
      var p = mod(e.at + off, pattern);
      for (var k = -1; k <= 1; k++) {
        var lo = p + k * pattern;
        var d = dir > 0 ? playerX - (lo + e.len) : lo - (playerX + 1);
        if (d >= 0 && d < best) best = d;
      }
    }
    return best;
  }

  /*
   * Reihen von UNTEN nach OBEN. Index 0 = Start (Vorplatz vor der Haustür).
   * Kommentare nennen die Reihe aus level1.ts, aus der die Spur stammt.
   */
  var LEVEL = {
    id: 'level1-ad',
    cols: 9,
    timeLimit: 75,
    lives: 3,
    speedScale: 0.78,
    goalSlots: [4],
    stars: {
      two: { minLives: 2, minTimeFrac: 0.25 },
      three: { minLives: 3, minTimeFrac: 0.4, minPickupFrac: 0.7 },
    },
    lanes: [
      /* 0 */ { kind: 'start', skin: 'sidewalk' },
      /* 1 */ { kind: 'safe', skin: 'grass', coinAt: 6 },
      /* 2  (l1 #2) */ { kind: 'traffic', skin: 'road', dir: 1, speed: 1.6, patternCells: 14, entities: [{ type: 'car', at: 0, len: 2 }, { type: 'car', at: 7, len: 2 }] },
      /* 3  (l1 #3) */ { kind: 'traffic', skin: 'road-dashed', dir: -1, speed: 2.0, phase: 1.4, patternCells: 13, entities: [{ type: 'car', at: 0, len: 2 }, { type: 'car', at: 6.5, len: 2 }] },
      /* 4 */ { kind: 'safe', skin: 'grass' },
      /* 5  (l1 #5) */ { kind: 'traffic', skin: 'road', dir: -1, speed: 1.5, patternCells: 15, entities: [{ type: 'van', at: 0, len: 3 }, { type: 'van', at: 8, len: 3 }] },
      /* 6  (l1 #6) */ { kind: 'traffic', skin: 'road-dashed', dir: 1, speed: 2.5, phase: 0.7, patternCells: 14, entities: [{ type: 'bike', at: 0, len: 1 }, { type: 'bike', at: 6, len: 1 }], coinAt: 4 },
      /* 7  (l1 #7, Bäckerei) */ { kind: 'safe', skin: 'sidewalk', checkpoint: true, pickup: { at: 2, type: 'coffee' } },
      /* 8  (l1 #8, Busspur) */ { kind: 'traffic', skin: 'road', dir: -1, speed: 2.0, patternCells: 18, entities: [{ type: 'bus', at: 0, len: 4 }, { type: 'bus', at: 10, len: 3.5 }] },
      /* 9  (l1 #9) */ { kind: 'safe', skin: 'grass', checkpoint: true, coinAt: 7 },
      /* 10 (l1 #16, Gleis) */ { kind: 'traffic', skin: 'rails', dir: -1, speed: 4.8, patternCells: 26, entities: [{ type: 'tram', at: 0, len: 7 }] },

function move(dx,dy){

  if(st.phase!=='play')return;
  st.lastInput=st.real;if(st.idle||!tapEl.classList.contains('off'))hideTap();

  if(toX<0||toX>COLS-1||toRow<0||toRow>GOAL){st.bump={dx:dx,dy:dy,t:0};return;}
  var target=L.lanes[toRow];
  if(target.kind==='goal'&&L.goalSlots.indexOf(toX)<0){st.bump={dx:dx,dy:dy,t:0};note(t.wall,'gold',1500);return;}
  st.fromX=st.vx;st.fromRow=st.vrow;st.moveT=0;st.row=toRow;st.x=toX;st.moves++;
  st.popT=0;st.dust=0;st.dustX=toX;st.dustRow=toRow;if(dx)st.dir=dx;
  sfx('hop');
  if(toRow>st.furthest){st.rowScore+=E.SCORE.perRow*(toRow-st.furthest);st.furthest=toRow;}
  if(target.checkpoint&&toRow>st.checkpoint){st.checkpoint=toRow;if(toRow!==9||st.tramNoted)note(t.checkpoint,'gold',1300);}
  if(toRow===9&&!st.tramNoted){st.tramNoted=true;note(t.tram,'warn',1900);}
  if(target.coinAt===toX&&!st.coins[toRow]){st.coins[toRow]=1;st.coinCount++;st.pickups++;st.pickupScore+=E.SCORE.perPickup;sfx('coin');fx('coin',toX,toRow);bumpCoins();}

  if(target.kind==='goal'){win();return;}

  }
}

    ctx.fillStyle='rgba(91,70,50,.75)';var sw=cell*.12,n=18;
    for(var i=0;i<n;i++)ctx.fillRect(bx+i*(bw-sw)/(n-1),y+cell*.2,sw,cell*.6);
    [.3,.7].forEach(function(p){ctx.fillStyle='#C3CAD8';ctx.fillRect(bx,y+cell*p-line,bw,line*2);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,y+cell*p+line,bw,Math.max(1,line*.6));});
  }

function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawGoal(y){
  for(var c=0;c<COLS;c++){
    if(L.goalSlots.indexOf(c)>=0)continue;
    ctx.fillStyle=PAL.wall;ctx.fillRect(bx+c*cell,y,cell+.5,cell);
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(bx+c*cell,y,cell+.5,Math.max(1,cell*.04));
  }
  L.goalSlots.forEach(function(c){
    var p=cell*.08,x=bx+c*cell+p,yy=y+p,s=cell-2*p,filled=st.goalFilled;
    if(!filled&&st.phase!=='intro'){var a=.35+.35*Math.sin(st.real*5);ctx.save();ctx.shadowColor='rgba(252,203,69,'+a+')';ctx.shadowBlur=cell*.5;rrect(x,yy,s,s,cell*.16);ctx.fillStyle='rgba(252,203,69,.12)';ctx.fill();ctx.restore();}
    rrect(x,yy,s,s,cell*.16);ctx.fillStyle=filled?'rgba(242,179,61,.33)':'rgba(11,30,63,.53)';ctx.fill();
    ctx.lineWidth=Math.max(2,cell*.05);ctx.strokeStyle=filled?PAL.goalSlot:'#FCCB45';ctx.stroke();
    drawClock(bx+c*cell+cell/2,y+cell/2,cell*.52,filled?PAL.goalSlot:'#FCCB45',filled);
  });
}
function drawClock(cx,cy,size,col,check){
  var k=size/24;ctx.save();ctx.translate(cx-12*k,cy-12*k);ctx.scale(k,k);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  if(check){ctx.moveTo(5,12.5);ctx.lineTo(10,17.5);ctx.lineTo(19,7);}
  else{ctx.arc(12,12.5,7.5,0,Math.PI*2);ctx.moveTo(12,8);ctx.lineTo(12,12.5);ctx.lineTo(15.5,14.5);ctx.moveTo(9,3);ctx.lineTo(15,3);ctx.moveTo(12,3);ctx.lineTo(12,5);}
  ctx.stroke();ctx.restore();
}
function drawCurbs(r0,r1){
  for(var r=Math.max(1,r0);r<r1;r++){
    if(danger(r)===danger(r+1)||L.lanes[r+1].kind==='goal')continue;
    var y=rowY(r),h=Math.max(1.5,cell*.045);
    ctx.fillStyle='rgba(222,228,240,.42)';ctx.fillRect(bx,y-h/2,bw,h);
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(bx,y+h/2,bw,Math.max(1,h*.6));
  }
}
function drawDeco(){
  var topH=TOP_H/DESIGN_W*bw,startH=START_H/DESIGN_W*bw;
  var yg=rowY(GOAL);
  if(yg>0)drawTex('streetTop',bx,yg-topH,bw,topH+.5,false);
  var y0=rowY(0);
  if(y0<H){
    drawTex('streetStart',bx,y0,bw,startH,false);
    var g=ctx.createLinearGradient(0,y0+startH*.4,0,y0+startH);g.addColorStop(0,'rgba(24,16,44,0)');g.addColorStop(1,'rgba(24,16,44,.34)');
    ctx.fillStyle=g;ctx.fillRect(bx,y0+startH*.4,bw,startH*.6+1);
  }
}
function shadow(cx,yb,w){ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(cx,yb-cell*.14,w/2,cell*.08,0,0,Math.PI*2);ctx.fill();}
function drawSprite(key,px,y,len,dir){
  var sp=SPRITES[key],im=IMG['s:'+key];if(!sp||!ok(im))return;
  var w=len*cell,h=(1+sp.overhang)*cell;
  shadow(px+w/2,y+cell,Math.max(cell*.3,(w-cell*.2)*(SHADOW_W[key]||1)));
  if(dir===-1){ctx.save();ctx.translate(px+w,0);ctx.scale(-1,1);ctx.drawImage(im,0,y+cell-h,w,h);ctx.restore();}
  else ctx.drawImage(im,px,y+cell-h,w,h);
}
function drawEntities(r){
  var lane=L.lanes[r];if(!lane.entities)return;
  var y=rowY(r),P=lane.patternCells,off=E.laneOffset(lane,st.t,SPD);
  for(var i=0;i<lane.entities.length;i++){
    var e=lane.entities[i],p=E.mod(e.at+off,P);
    for(var k=-1;k<=1;k++){var x=p+k*P;if(x+e.len<-.3||x>COLS+.3)continue;drawSprite(e.type,bx+x*cell,y,e.len,lane.dir);}
  }
}
function tramNear(lane){
  var off=E.laneOffset(lane,st.t,SPD),P=lane.patternCells,e=lane.entities[0],p=E.mod(e.at+off,P);
  for(var k=-1;k<=1;k++){var x=p+k*P;if(x+e.len>-6&&x<COLS+6)return true;}
  return false;
}
function drawTramWarn(r){
  var lane=L.lanes[r];if(!tramNear(lane))return;
  var y=rowY(r),on=Math.floor(st.real*4)%2===0,s=cell*.17;
  [bx+cell*.18,bx+bw-cell*.18].forEach(function(x,i){
    ctx.fillStyle='#1B2233';rrect(x-s*1.3,y-s*1.1,s*2.6,s*2.2,s*.6);ctx.fill();
    var lit=(i===0)===on;
    ctx.fillStyle=lit?'#FF5A52':'#5A2A2A';ctx.beginPath();ctx.arc(x,y,s*.75,0,Math.PI*2);ctx.fill();
    if(lit){ctx.fillStyle='rgba(255,90,82,.28)';ctx.beginPath();ctx.arc(x,y,s*1.9,0,Math.PI*2);ctx.fill();}
  });
}
function drawPickups(r){
  var lane=L.lanes[r],y=rowY(r),bob=Math.sin(st.real*3.2+r)*cell*.05;
  if(lane.coinAt!==undefined&&!st.coins[r]){var im=IMG['s:coin'],s=cell*.5,cx=bx+(lane.coinAt+.5)*cell;shadow(cx,y+cell+cell*.06,s*.75);if(ok(im))ctx.drawImage(im,cx-s/2,y+cell*.5-s/2+bob-cell*.04,s,s);}
  if(lane.pickup&&!st.coffeeTaken){var ic=IMG['s:coffee'],c2=bx+(lane.pickup.at+.5)*cell,sz=cell*.82;shadow(c2,y+cell+cell*.06,sz*.45);if(ok(ic))ctx.drawImage(ic,c2-sz/2,y+cell-sz-cell*.08+bob*.5,sz,sz);}
}
function popVal(){var p=st.popT;if(p<0)return 0;return p<.07?p/.07:Math.max(0,1-(p-.07)/.11);}
function drawPlayer(){
  var sp=SPRITES['player-sachbearbeiter'],im=IMG['s:player-sachbearbeiter'];if(!ok(im))return;
  var k=.92,w=cell*k,h=(1+sp.overhang)*cell*k;
  var bumpX=0,bumpY=0;if(st.bump){var b=st.bump.t<.2?Math.sin(st.bump.t/.2*Math.PI)*cell*.12:0;bumpX=st.bump.dx*b;bumpY=-st.bump.dy*b;}
  var cx=bx+(st.vx+.5)*cell+bumpX,yb=rowY(st.vrow)+cell-cell*.07+bumpY;
  var p=popVal(),dying=st.phase==='dying'||(st.phase==='lost'&&st.lives<=0);
  shadow(cx,yb+cell*.07,w*.62*(1-p*.25));
  if(st.dust>=0&&st.dust<1){var d=st.dust,dx=bx+(st.dustX+.5)*cell,dy=rowY(st.dustRow)+cell*.86;ctx.fillStyle='rgba(255,255,255,'+((1-d)*.55).toFixed(3)+')';ctx.beginPath();ctx.ellipse(dx,dy,w*.45*(.5+d*1.3),cell*.12*(.5+d*1.3),0,0,Math.PI*2);ctx.fill();}
  var a=1;if(st.real<st.invulnUntil)a=.35+.65*(Math.sin(st.real*26)>0?1:0);if(dying)a=.78;
  ctx.save();ctx.globalAlpha=a;ctx.translate(cx,yb-p*cell*.22);ctx.scale(dying?1.25:1+p*.12,dying?.55:1-p*.1);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
}
function drawFx(dt){
  for(var i=st.fx.length-1;i>=0;i--){
    var f=st.fx[i];f.t+=dt;var cx=bx+(f.x+.5)*cell,cy=rowY(f.row)+cell*.45;
    if(f.kind==='coin'){
      var a=1-f.t/.8;if(a<=0){st.fx.splice(i,1);continue;}
      ctx.save();ctx.globalAlpha=a;ctx.font='900 '+Math.round(cell*.42)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=Math.max(3,cell*.09);ctx.strokeStyle='#000D42';ctx.fillStyle='#FFD257';
      var ty=cy-cell*.3-f.t*cell*.9;ctx.strokeText('+25',cx,ty);ctx.fillText('+25',cx,ty);
      for(var j=0;j<6;j++){var an=j/6*Math.PI*2+f.t*2,rr=cell*(.25+f.t*.9);ctx.fillStyle='#FCCB45';ctx.beginPath();ctx.arc(cx+Math.cos(an)*rr,cy+Math.sin(an)*rr*.7,cell*.05*(1-f.t),0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }else if(f.kind==='crash'){
      var q=f.t/.45;if(q>=1){st.fx.splice(i,1);continue;}
      ctx.save();ctx.globalAlpha=1-q;ctx.translate(cx,cy);ctx.rotate(q*.6);var R=cell*(.35+q*.55),r2=R*.45;ctx.beginPath();

}
function drawConfetti(dt){
  for(var i=confetti.length-1;i>=0;i--){var c=confetti[i];c.life+=dt;c.vy+=60*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;
    if(c.y>H+30||c.life>3.2){confetti.splice(i,1);continue;}
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.scale(1,Math.cos(c.life*7));ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();}
}
function draw(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#071B3A';ctx.fillRect(0,0,W,H);
  var sh=reduce?0:st.shake,ox=sh?(Math.random()-.5)*8*sh:0,oy=sh?(Math.random()-.5)*8*sh:0;
  ctx.save();ctx.translate(ox,oy);
  ctx.beginPath();ctx.rect(bx,0,bw,H);ctx.clip();
  var r0=Math.max(0,Math.floor(cam)-1),r1=Math.min(GOAL,Math.ceil(cam+H/cell)+1);
  for(var r=r0;r<=r1;r++)drawLaneBg(r);
  drawCurbs(r0,r1);
  drawDeco();
  var pr=Math.round(st.vrow);
  for(r=r1;r>=r0;r--){
    drawPickups(r);drawEntities(r);
    if(L.lanes[r].skin==='rails')drawTramWarn(r);
    if(r===pr)drawPlayer();
  }
  drawFx(dt);

/* ---------------- Schleife ---------------- */
var last=0;
function update(dt){
  st.real+=dt;
  st.t+=dt*(st.real<st.coffeeUntil?E.COFFEE_BOOST.factor:1);
  if(st.moveT<1){st.moveT=Math.min(1,st.moveT+dt/.09);}
  var e=1-Math.pow(1-st.moveT,2);st.vx=st.fromX+(st.x-st.fromX)*e;st.vrow=st.fromRow+(st.row-st.fromRow)*e;
  if(st.popT>=0){st.popT+=dt;if(st.popT>.18)st.popT=-1;}
  if(st.dust>=0){st.dust+=dt/.32;if(st.dust>=1)st.dust=-1;}
  if(st.bump){st.bump.t+=dt;if(st.bump.t>.2)st.bump=null;}
  st.shake=Math.max(0,st.shake-dt*3);
  if(st.phase==='play'){
    st.timeLeft-=dt;
    if(st.timeLeft<=0){st.timeLeft=0;lose('time');}
    else{var lane=L.lanes[st.row];if(lane.kind==='traffic'&&st.real>=st.invulnUntil&&!god&&E.laneHitsPlayer(lane,st.t,st.x,SPD))die();}
    if(!st.idle&&st.phase==='play'&&st.real-st.lastInput>4.5){st.idle=true;showTap(t.idle);}
  }
  if(st.phase==='dying'&&st.real-st.dyingAt>.7){if(st.lives<=0)lose('lives');else respawn();}
  var target=camTarget();
  if(!camSet){cam=target;camSet=true;}else cam+=(target-cam)*Math.min(1,dt*7);
  if(!handEl.classList.contains('off'))placeHint();
}
/* Hand an der Figur; die Pille sitzt unter ihr, wenn dort Platz ist, sonst über ihrem Kopf. */
function placeHint(){
  if(!camSet){cam=camTarget();camSet=true;}
  var hx=bx+(st.vx+.5)*cell+cell*.05,hy=rowY(st.vrow)+cell*.1;
  handEl.style.transform='translate('+Math.round(hx)+'px,'+Math.round(hy)+'px)';
  var fy=rowY(st.vrow)+cell,ph=tapEl.offsetHeight,top=fy+cell*.55;
  if(top+ph>effBottom-2)top=fy-cell*1.7-ph;
  tapEl.style.top=Math.round(Math.max(effTop+6,top))+'px';
}
function frame(ts){
  requestAnimationFrame(frame);
  if(paused||hidden){last=0;return;}
  var dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;
  if(!assetsOk)return;
  update(dt);draw(dt);updateHud();
  if(!readySent)ready();
}

/* ---------------- Endkarte ---------------- */
var STAR='M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z';
function starSvg(on){return '<svg viewBox="0 0 24 24">'+(on?'<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FDBC34"/></linearGradient></defs><path d="'+STAR+'" fill="url(#sg)" stroke="#CE8214" stroke-width="1.2" stroke-linejoin="round"/><path d="M8.2 9.6l2.3-.3" stroke="#fff" stroke-opacity=".8" stroke-width="1.3" stroke-linecap="round"/>':'<path d="'+STAR+'" fill="#2E4370" stroke="#41609A" stroke-width="1.2" stroke-linejoin="round"/>')+'</svg>';}
var endTimers=[];
function later(fn,ms){endTimers.push(setTimeout(fn,ms));}
function showEnd(won,reason){
  var res=st.result,n=won?res.stars:0,h='';
  for(var i=0;i<3;i++)h+=starSvg(i<n);
  $('stars').innerHTML=h;$('stars').setAttribute('aria-label',t.stars.replace('{n}',n));
  $('end-title').textContent=won?t.winTitle:(reason==='time'?t.timeTitle:t.failTitle);
  $('end-text').textContent=won?t.winText:t.failText;
  var resEl=$('end-res');
  if(won){resEl.innerHTML='<b>0</b> '+t.points+' · '+clock(st.timeLeft)+' '+t.left;}
  else{resEl.innerHTML=t.distance+' <b>'+st.furthest+'/'+GOAL+'</b>';}
  endEl.hidden=false;void endEl.offsetWidth;endEl.classList.add('on');
  if(won)sfx('stingComplete');
  var svgs=$('stars').querySelectorAll('svg');
  for(var k=0;k<3;k++)(function(k){later(function(){svgs[k].classList.add('pop');if(k<n)sfx('stingStar');},won?380+k*330:120);})(k);
  if(won){var b=resEl.querySelector('b'),t0=performance.now(),dur=900;(function count(){var q=Math.min(1,(performance.now()-t0)/dur);b.textContent=fmt(res.score*(1-Math.pow(1-q,3)));if(q<1&&!endEl.hidden)requestAnimationFrame(count);})();}
  later(function(){$('end-cta').classList.add('pulse');},1300);
}
function hideEnd(){endTimers.forEach(clearTimeout);endTimers=[];endEl.classList.remove('on');endEl.hidden=true;$('end-cta').classList.remove('pulse');}

/* ---------------- Eingabe ---------------- */
var ptr=null,TH=24;
function inUi(el){return el&&el.closest&&el.closest('button,.end');}
document.addEventListener('pointerdown',function(e){touched=true;unlock();if(inUi(e.target)||ptr)return;ptr={id:e.pointerId,x:e.clientX,y:e.clientY,fired:false};if(e.cancelable)e.preventDefault();},{passive:false});
document.addEventListener('pointermove',function(e){
  if(!ptr||e.pointerId!==ptr.id||ptr.fired)return;
  var dx=e.clientX-ptr.x,dy=e.clientY-ptr.y,ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax<TH&&ay<TH)return;ptr.fired=true;
  if(ax>ay)move(dx>0?1:-1,0);else move(0,dy<0?1:-1);
});
function up(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  if(!ptr.fired&&e.type==='pointerup'){var ax=Math.abs(e.clientX-ptr.x),ay=Math.abs(e.clientY-ptr.y);if(ax<TH&&ay<TH)move(0,1);}
  ptr=null;
}
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
document.addEventListener('touchmove',function(e){if(!inUi(e.target)&&e.cancelable)e.preventDefault();},{passive:false});
document.addEventListener('keydown',function(e){
  unlock();if(!endEl.hidden)return;
  var k=e.key,m=null;
  if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')m=[0,1];else if(k==='ArrowDown'||k==='s'||k==='S')m=[0,-1];else if(k==='ArrowLeft'||k==='a'||k==='A')m=[-1,0];else if(k==='ArrowRight'||k==='d'||k==='D')m=[1,0];
  if(m){if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&k===' ')return;e.preventDefault();move(m[0],m[1]);}
});
$('sound').addEventListener('click',function(){soundOn=!soundOn;if(soundOn){unlock();sfx('tap');}else stopAll();soundIcon();});
$('cta').addEventListener('click',openStore);
$('end-cta').addEventListener('click',openStore);
$('replay').addEventListener('click',function(){sfx('tap');hideEnd();reset();renderHearts(false);});
document.addEventListener('visibilitychange',function(){hidden=document.hidden;if(hidden)stopAll();});
window.addEventListener('resize',function(){layout();});

/* ---------------- Start ---------------- */
$('lvl').textContent=t.level;$('lbl-lives').textContent=t.lives;$('lbl-coins').textContent=t.coins;
$('ad-label').textContent=t.adLabel;$('end-cta-label').textContent=t.endCta;$('replay').textContent=t.replay;
$('end-tag').textContent=t.tagline;$('promo-tag').textContent=t.tagline;$('boost-label').textContent=t.boost;
var feats=t.feats.map(function(f){return '<span>'+f+'</span>';}).join('');$('end-feats').innerHTML=feats;$('promo-feats').innerHTML=feats;
['cta-icon','end-icon','promo-icon'].forEach(function(id){$(id).src=ICON;});
$('boost-icon').src=SPRITES.coffee.src;
soundIcon();reset();renderHearts(false);layout();updateHud();
requestAnimationFrame(frame);
setTimeout(ready,400);
window.__frPlayable={state:function(){return st;},move:move,god:function(v){god=!!v;},step:function(ms){for(var i=0;i<ms/16;i++)update(.016);draw(.016);updateHud();},view:function(){return {W:W,H:H,cell:cell,bx:bx,bw:bw,land:land,cam:cam,effTop:effTop,effBottom:effBottom};},T:T,lang:LANG};
})();
</script>
